name: Sandbox Core Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/sandbox-core-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-sandbox-core-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 20
    env:
      APP_ENV: staging
      ALLOW_REAL_CUSTOMER_DATA: 'false'
      ALLOW_REAL_CHARGES: 'false'
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SANDBOX_DATABASE_URL: ${{ secrets.SANDBOX_DATABASE_URL }}

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Require sandbox isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test "$ALLOW_REAL_CUSTOMER_DATA" = false
          test "$ALLOW_REAL_CHARGES" = false
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SANDBOX_DATABASE_URL:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Reject known non-authoritative migration versions
        shell: bash
        run: |
          set -euo pipefail
          legacy_versions=(
            20260823041755
            20260823041955
            20260823042303
            20260823042438
            20260823043540
            20260823043647
            20260823043717
            20260823111016
          )
          for version in "${legacy_versions[@]}"; do
            if [[ "$(psql "$SANDBOX_DATABASE_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations where version='${version}'")" != "0" ]]; then
              echo "Migration version drift detected in sandbox: ${version}" >&2
              exit 1
            fi
          done

      - name: Dry-run migrations
        shell: bash
        run: supabase db push --db-url "$SANDBOX_DATABASE_URL" --include-all --dry-run

      - name: Apply migrations
        shell: bash
        run: supabase db push --db-url "$SANDBOX_DATABASE_URL" --include-all

      - name: Verify repository migrations are recorded remotely
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r file; do
            version="$(basename "$file" | cut -d_ -f1)"
            if [[ "$(psql "$SANDBOX_DATABASE_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations where version='${version}'")" != "1" ]]; then
              echo "Migration not recorded in sandbox: ${version} ($(basename "$file"))" >&2
              missing=1
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "$missing" = 0

      - name: Deploy V1 core Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            booking-hold
            booking-checkout
            booking-submit
            prebook-access
            appointment-action-access
            demand-capture
            demand-capture-admin
            admin-agenda
            admin-appointment-timeline
            admin-balance-collections
            admin-dashboard
            admin-operation-settings
            admin-birthday-settings
            admin-notifications
            admin-service-settings
            admin-appointment-actions
            admin-reschedule-actions
            admin-pre-reservations
            admin-read-models
            balance-collection-access
            balance-collection-notify-email
            balance-collection-provider-cancel
            balance-collection-worker
            google-oauth
            google-sync
            google-webhook
            google-watch
            google-appointment-sync
            kommo-sync
            email-send
            integration-worker
            integration-worker-trigger
          )
          for fn in "${functions[@]}"; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Smoke public custom-auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"operation":"RESOLVE","scope":"CANCEL"}' \
            "$base/appointment-action-access")"
          if [[ "$status" != "400" ]] || ! grep -q 'LINK_INVALID_OR_EXPIRED' "$body"; then
            echo "appointment-action-access smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"action":"CONTEXT","checkout_hold_token":"invalid-token-that-is-long-enough-for-smoke-test"}' \
            "$base/booking-checkout")"
          if [[ "$status" != "409" ]] || ! grep -q 'CHECKOUT_HOLD_NOT_ACTIVE' "$body"; then
            echo "booking-checkout smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/email-send")"
          if [[ "$status" != "401" ]] || ! grep -q 'INTERNAL_AUTH_REQUIRED' "$body"; then
            echo "email-send custom auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/balance-collection-worker")"
          if [[ "$status" != "401" ]] || ! grep -q 'INTERNAL_AUTH_REQUIRED' "$body"; then
            echo "balance-collection-worker custom auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/google-oauth")"
          if [[ "$status" != "401" ]] || ! grep -q 'ADMIN_AUTH_REQUIRED' "$body"; then
            echo "google-oauth admin auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/google-sync")"
          if [[ "$status" != "401" ]] || ! grep -q 'ADMIN_AUTH_REQUIRED' "$body"; then
            echo "google-sync admin/internal auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/google-watch")"
          if [[ "$status" != "401" ]] || ! grep -q 'ADMIN_AUTH_REQUIRED' "$body"; then
            echo "google-watch admin/internal auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/google-appointment-sync")"
          if [[ "$status" != "401" ]] || ! grep -q 'INTERNAL_AUTH_REQUIRED' "$body"; then
            echo "google-appointment-sync internal auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST "$base/google-webhook")"
          if [[ "$status" != "204" ]]; then
            echo "google-webhook malformed notification smoke failed: HTTP $status" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/integration-worker-trigger")"
          if [[ "$status" != "401" ]] || ! grep -q 'GITHUB_OIDC_REQUIRED' "$body"; then
            echo "integration-worker-trigger OIDC smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request GET "$base/admin-notifications")"
          if [[ "$status" != "401" ]] || ! grep -Eq 'ADMIN_AUTH_REQUIRED|UNAUTHORIZED_NO_AUTH_HEADER' "$body"; then
            echo "admin-notifications auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request GET "$base/admin-birthday-settings")"
          if [[ "$status" != "401" ]] || ! grep -Eq 'ADMIN_AUTH_REQUIRED|UNAUTHORIZED_NO_AUTH_HEADER' "$body"; then
            echo "admin-birthday-settings auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request GET "$base/admin-read-models?view=finance")"
          if [[ "$status" != "401" ]] || ! grep -q 'ADMIN_AUTH_REQUIRED' "$body"; then
            echo "admin-read-models auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request GET "$base/admin-appointment-timeline?appointment_id=95800000-0000-0000-0000-000000000030")"
          if [[ "$status" != "401" ]] || ! grep -q 'ADMIN_AUTH_REQUIRED' "$body"; then
            echo "admin-appointment-timeline auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Sandbox Core Deploy'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Project: \`${SUPABASE_PROJECT_REF}\`"
            echo '- Dados reais permitidos: `false`'
            echo '- Cobranças reais permitidas: `false`'
            echo '- Migration history: validado contra versões de `main`'
            echo '- Google provider: funções implantadas, mas conexão/worker permanecem condicionados a OAuth explícito e `GOOGLE_INTEGRATION_ENABLED`'
            echo '- Google custom-auth boundaries: smoke de OAuth/sync/watch/webhook/appointment-sync executado sem conectar conta'
            echo '- Admin read models/timeline: financeiro/pacotes/auditoria/equipe/integrações implantados com autenticação e permissão'
            echo '- Admin notifications: gateway implantado e boundary de autenticação validado sem enviar mensagens'
            echo '- Admin birthday settings: gateway implantado e boundary de autenticação validado; automação permanece sem runtime'
            echo '- Cobrança de saldo: admin/access/email/provider-cancel/worker implantados; worker protegido por autenticação interna'
            echo '- Kommo adapter/worker: código implantado, sincronização permanece condicionada a settings enabled e gate #112'
            echo '- Email adapter/worker/trigger: código implantado; flags LIVE permanecem em Edge secrets e não são alteradas pelo deploy'
            echo '- Mercado Pago provider: não alterado por este workflow'
          } >> "$GITHUB_STEP_SUMMARY"
