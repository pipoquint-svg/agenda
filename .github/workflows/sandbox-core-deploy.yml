name: Sandbox Core Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/sandbox-core-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-sandbox-core-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 20
    env:
      APP_ENV: staging
      ALLOW_REAL_CUSTOMER_DATA: 'false'
      ALLOW_REAL_CHARGES: 'false'
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SANDBOX_DATABASE_URL: ${{ secrets.SANDBOX_DATABASE_URL }}

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Require sandbox isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test "$ALLOW_REAL_CUSTOMER_DATA" = false
          test "$ALLOW_REAL_CHARGES" = false
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SANDBOX_DATABASE_URL:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Dry-run migrations
        shell: bash
        run: supabase db push --db-url "$SANDBOX_DATABASE_URL" --include-all --dry-run

      - name: Apply migrations
        shell: bash
        run: supabase db push --db-url "$SANDBOX_DATABASE_URL" --include-all

      - name: Deploy V1 core Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            booking-hold
            booking-checkout
            booking-submit
            prebook-access
            appointment-action-access
            demand-capture
            demand-capture-admin
            admin-agenda
            admin-service-settings
            admin-appointment-actions
            admin-reschedule-actions
            admin-pre-reservations
          )
          for fn in "${functions[@]}"; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Smoke public custom-auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"operation":"RESOLVE","scope":"CANCEL"}' \
            "$base/appointment-action-access")"
          if [[ "$status" != "400" ]] || ! grep -q 'LINK_INVALID_OR_EXPIRED' "$body"; then
            echo "appointment-action-access smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"action":"CONTEXT","checkout_hold_token":"invalid-token-that-is-long-enough-for-smoke-test"}' \
            "$base/booking-checkout")"
          if [[ "$status" != "400" ]]; then
            echo "booking-checkout smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Sandbox Core Deploy'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Project: \`${SUPABASE_PROJECT_REF}\`"
            echo '- Dados reais permitidos: `false`'
            echo '- Cobranças reais permitidas: `false`'
            echo '- Google provider: não implantado por este workflow'
            echo '- Kommo provider: não habilitado por este workflow'
            echo '- Mercado Pago provider: não alterado por este workflow'
          } >> "$GITHUB_STEP_SUMMARY"
