name: Demand Capture

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  demand-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test historical secret classification
        run: bash scripts/test-preprod-secret-history-scan.sh

      - name: Historical secret scan
        run: |
          set -o pipefail
          bash scripts/preprod-secret-history-scan.sh 2>&1 | tee secret-scan-report.txt

      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprod-secret-scan-report
          path: secret-scan-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test demand capture validation
        run: deno test supabase/functions/_shared/demand-capture_test.ts

      - name: Type-check demand capture functions
        run: |
          deno check supabase/functions/demand-capture/index.ts
          deno check supabase/functions/demand-capture-admin/index.ts

      - name: Enforce module isolation
        run: |
          if grep -R -n -E 'resource_allocations|appointments|checkout_holds|availability_rules|availability_exceptions|google_calendar' \
            supabase/migrations/20260821204000_demand_capture.sql \
            supabase/functions/demand-capture \
            supabase/functions/demand-capture-admin \
            supabase/functions/_shared/demand-capture.ts; then
            echo "Demand capture attempted to depend on booking, availability or calendar state"
            exit 1
          fi

      - name: Enforce public editorial rule
        run: |
          if grep -R -n -E '—|–' \
            web/src/DemandCaptureForm.tsx \
            supabase/functions/demand-capture \
            supabase/functions/_shared/demand-capture.ts; then
            echo "Typographic dash found in public demand capture content"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Type-check web
        working-directory: web
        run: npm run check

      - name: Build web
        working-directory: web
        run: npm run build
