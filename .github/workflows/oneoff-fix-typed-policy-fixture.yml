name: One-off fix typed policy fixture
on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-typed-policy-fixture.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch fixture
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/fixtures/gestao-critical.sql')
          s = p.read_text()
          old = '''  reschedule_first_early_percent,
  reschedule_first_late_percent,
  reschedule_repeat_percent,
  cancellation_late_percent
) values (
  '99000000-0000-0000-0000-000000000010',
  0, 0, 0, 0, 0
);'''
          new = '''  reschedule_first_early_percent,
  reschedule_first_late_percent,
  reschedule_repeat_percent,
  cancellation_late_percent,
  reschedule_first_early_penalty_type,
  reschedule_first_early_penalty_value,
  reschedule_first_late_penalty_type,
  reschedule_first_late_penalty_value,
  reschedule_repeat_penalty_type,
  reschedule_repeat_penalty_value,
  cancellation_late_penalty_type,
  cancellation_late_penalty_value
) values (
  '99000000-0000-0000-0000-000000000010',
  0, 0, 0, 0, 0,
  'PERCENT', 0,
  'PERCENT', 0,
  'PERCENT', 0,
  'PERCENT', 0
);'''
          if old not in s:
              raise SystemExit('fixture policy insert marker not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit repair
        run: |
          rm .github/workflows/oneoff-fix-typed-policy-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(db): align critical fixture with typed penalties'
          git push