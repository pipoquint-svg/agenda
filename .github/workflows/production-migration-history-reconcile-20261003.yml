name: Production Migration History Reconcile 2026-10-03

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/production-migration-history-reconcile-20261003.yml
      - scripts/production_migration_history_reconcile_20261003.py
      - supabase/migrations/20261003190846_balance_magic_payment_link.sql
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character main SHA containing the audited reconciliation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agenda-production-deploy
  cancel-in-progress: false

jobs:
  audit-local:
    runs-on: ubuntu-latest
    steps:
      - name: Require the exact main SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = 'refs/heads/main'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$EVENT_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Audit the fail-closed reconciliation state machine
        run: python3 scripts/production_migration_history_reconcile_20261003.py audit-local

  reconcile:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: audit-local
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: sbexdggbwqvyhbkatucs
    steps:
      - name: Checkout exact gated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Verify checkout and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Link the exact production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Reconcile tracking metadata only
        run: >-
          python3 scripts/production_migration_history_reconcile_20261003.py
          apply --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify only the magic-link migration remains pending
        run: >-
          python3 scripts/production_migration_history_reconcile_20261003.py
          verify-ready --project-ref "$SUPABASE_PROJECT_REF"
      - name: Prove the database deployment preview is now safe
        run: supabase db push --linked --dry-run
