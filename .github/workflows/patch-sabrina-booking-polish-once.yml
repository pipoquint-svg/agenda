name: Patch Sabrina Booking Polish Once

on:
  push:
    branches: [fix/sabrina-booking-polish]
    paths:
      - '.github/workflows/patch-sabrina-booking-polish-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sabrina-booking-polish
          fetch-depth: 0

      - name: Apply Sabrina booking UI polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          journey = Path('web/src/SabrinaBookingJourney.tsx')
          text = journey.read_text()

          needle = "  const [extraQuantities, setExtraQuantities] = useState<Record<string, number>>({})\n"
          replacement = needle + "  const [expandedExtras, setExpandedExtras] = useState<Record<string, boolean>>({})\n"
          if needle not in text:
              raise SystemExit('extraQuantities state anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = "    setExtraQuantities(Object.fromEntries(\n      (next?.extras ?? []).filter((extra) => extra.is_required).map((extra) => [extra.id, 1]),\n    ))\n"
          replacement = needle + "    setExpandedExtras({})\n"
          if needle not in text:
              raise SystemExit('chooseService extras anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = "                        {extra.description ? <small>{extra.description}</small> : null}\n"
          replacement = """                        {extra.description ? (\n                          <>\n                            {expandedExtras[extra.id] ? <small className=\"sby-extra-description\">{extra.description}</small> : null}\n                            <button\n                              type=\"button\"\n                              className=\"sby-extra-more\"\n                              aria-expanded={Boolean(expandedExtras[extra.id])}\n                              onClick={() => setExpandedExtras((current) => ({ ...current, [extra.id]: !current[extra.id] }))}\n                            >\n                              {expandedExtras[extra.id] ? 'Ver menos' : 'Ver mais'}\n                            </button>\n                          </>\n                        ) : null}\n"""
          if needle not in text:
              raise SystemExit('extra description anchor not found')
          text = text.replace(needle, replacement, 1)
          journey.write_text(text)

          css = Path('web/src/sabrinaBookingJourney.css')
          styles = css.read_text()

          styles = styles.replace(
              '.sby-card {\n  width: min(100%, 980px);',
              '.sby-card {\n  width: min(100%, 900px);\n  min-width: 0;',
              1,
          )
          styles = styles.replace(
              '.sby-head {\n  padding: 34px 38px 28px;',
              '.sby-head {\n  padding: 28px 30px 24px;',
              1,
          )
          styles = styles.replace(
              '.sby-head h1 { max-width: 720px; font-size: clamp(30px, 4vw, 46px); line-height: 1.05; }',
              '.sby-head h1 { max-width: 720px; font-size: clamp(28px, 3.5vw, 40px); line-height: 1.05; }',
              1,
          )
          styles = styles.replace(
              '.sby-stepper {\n  display: grid;\n  grid-template-columns: repeat(8, minmax(0, 1fr));\n  gap: 0;\n  padding: 0 28px;',
              '.sby-stepper {\n  display: grid;\n  grid-template-columns: repeat(8, minmax(0, 1fr));\n  gap: 0;\n  padding: 0 18px;',
              1,
          )
          styles = styles.replace(
              '  min-width: 76px;\n  padding: 17px 6px 15px;',
              '  min-width: 68px;\n  padding: 14px 5px 12px;',
              1,
          )
          styles = styles.replace(
              '.sby-stage { padding: 34px 38px 40px; }',
              '.sby-stage { min-width: 0; padding: 28px 30px 34px; }',
              1,
          )
          styles = styles.replace(
              '.sby-stage-title { margin-bottom: 26px; }',
              '.sby-stage-title { margin-bottom: 22px; }',
              1,
          )
          styles = styles.replace(
              '.sby-stage-title h2 { font-size: clamp(26px, 3vw, 36px); line-height: 1.15; }',
              '.sby-stage-title h2 { font-size: clamp(24px, 2.7vw, 32px); line-height: 1.12; }',
              1,
          )

          old_extra = '.sby-extra { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px; border: 1px solid var(--sby-line); border-radius: 16px; background: #fff; }\n.sby-extra.selected { border-color: rgba(36, 32, 29, .42); background: var(--sby-soft); }\n.sby-extra > div { display: grid; gap: 5px; }\n.sby-extra small, .sby-extra em { color: var(--sby-muted); font-size: 12px; font-style: normal; line-height: 1.45; }\n.sby-extra span { font-size: 13px; font-weight: 700; }\n.sby-extra button, .sby-extra select { min-height: 38px; padding: 8px 12px; border: 1px solid var(--sby-line); border-radius: 10px; background: #fff; }\n.sby-extra button { cursor: pointer; }\n.sby-extra b { font-size: 12px; color: var(--sby-muted); }'
          new_extra = '.sby-extra { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 16px; border: 1px solid var(--sby-line); border-radius: 14px; background: #fff; }\n.sby-extra.selected { border-color: rgba(36, 32, 29, .42); background: var(--sby-soft); }\n.sby-extra > div { display: grid; gap: 5px; flex: 1 1 auto; min-width: 0; }\n.sby-extra small, .sby-extra em { color: var(--sby-muted); font-size: 12px; font-style: normal; line-height: 1.45; }\n.sby-extra span { font-size: 13px; font-weight: 700; }\n.sby-extra button, .sby-extra select { flex: 0 0 auto; min-height: 38px; padding: 8px 12px; border: 1px solid var(--sby-line); border-radius: 10px; background: #fff; color: var(--sby-ink); }\n.sby-extra button { cursor: pointer; }\n.sby-extra b { flex: 0 0 auto; font-size: 12px; color: var(--sby-muted); }\n.sby-extra .sby-extra-description { display: block; max-width: 64ch; }\n.sby-extra .sby-extra-more { justify-self: start; min-height: 0; padding: 1px 0; border: 0; border-radius: 0; background: transparent; color: var(--sby-ink); font-size: 11px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }'
          if old_extra not in styles:
              raise SystemExit('extra css anchor not found')
          styles = styles.replace(old_extra, new_extra, 1)

          old_calendar = '.sby-calendar { max-width: 620px; margin: 0 auto; }\n.sby-calendar-head { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; margin-bottom: 16px; }\n.sby-calendar-head strong { text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 500; }\n.sby-calendar-head button { width: 38px; height: 38px; border: 1px solid var(--sby-line); border-radius: 999px; background: #fff; cursor: pointer; font-size: 24px; line-height: 1; }\n.sby-calendar-head button:disabled { opacity: .25; cursor: default; }\n.sby-calendar-weekdays, .sby-calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }\n.sby-calendar-weekdays { margin-bottom: 7px; }\n.sby-calendar-weekdays span { text-align: center; font-size: 10px; font-weight: 800; color: var(--sby-muted); }\n.sby-calendar-day, .sby-calendar-blank { aspect-ratio: 1 / 1; }\n.sby-calendar-day { display: grid; place-items: center; border: 1px solid transparent; border-radius: 12px; background: #f7f4f0; color: #b0a8a1; cursor: default; }\n.sby-calendar-day.available { border-color: var(--sby-line); background: #fff; color: var(--sby-ink); cursor: pointer; font-weight: 700; }\n.sby-calendar-day.available:hover { border-color: var(--sby-accent); }\n.sby-calendar-day.selected { background: var(--sby-accent); color: #fff; border-color: var(--sby-accent); }'
          new_calendar = '.sby-calendar { width: 100%; max-width: 740px; min-width: 0; margin: 0 auto; }\n.sby-calendar-head { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; max-width: 680px; margin: 0 auto 14px; }\n.sby-calendar-head strong { text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 500; }\n.sby-calendar-head button { width: 36px; height: 36px; border: 1px solid var(--sby-line); border-radius: 999px; background: #fff; cursor: pointer; font-size: 22px; line-height: 1; }\n.sby-calendar-head button:disabled { opacity: .2; cursor: default; }\n.sby-calendar-weekdays, .sby-calendar-grid { width: 100%; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }\n.sby-calendar-weekdays { margin-bottom: 6px; }\n.sby-calendar-weekdays span { text-align: center; font-size: 9px; font-weight: 800; color: var(--sby-muted); }\n.sby-calendar-day, .sby-calendar-blank { min-width: 0; aspect-ratio: 1.16 / 1; }\n.sby-calendar-day { display: grid; place-items: center; border: 1px solid transparent; border-radius: 11px; background: #f4f0ec; color: #c3bbb4; opacity: .42; cursor: not-allowed; font-weight: 500; }\n.sby-calendar-day.available { opacity: 1; border-color: rgba(36, 32, 29, .28); background: #fffdfa; color: var(--sby-ink); cursor: pointer; font-weight: 800; box-shadow: 0 2px 8px rgba(48, 40, 33, .045); }\n.sby-calendar-day.available:hover { border-color: var(--sby-accent); background: #f8f4ef; }\n.sby-calendar-day.selected { opacity: 1; background: var(--sby-accent); color: #fff; border-color: var(--sby-accent); }'
          if old_calendar not in styles:
              raise SystemExit('calendar css anchor not found')
          styles = styles.replace(old_calendar, new_calendar, 1)

          styles = styles.replace(
              '.sby-primary { background: var(--sby-accent); color: #fff; }\n.sby-secondary { background: transparent; color: var(--sby-ink); }',
              '.sby-shell .sby-primary { background: var(--sby-accent); color: #fff; }\n.sby-shell .sby-secondary { background: transparent; color: var(--sby-ink); }',
              1,
          )

          media_anchor = '@media (max-width: 760px) {'
          media_insert = '''@media (max-width: 760px) {\n  .sby-calendar { max-width: 100%; }\n  .sby-calendar-weekdays, .sby-calendar-grid { gap: 4px; }\n  .sby-calendar-day, .sby-calendar-blank { aspect-ratio: 1 / 1; }\n  .sby-calendar-day { border-radius: 9px; font-size: 13px; }\n'''
          if media_anchor not in styles:
              raise SystemExit('mobile media anchor not found')
          styles = styles.replace(media_anchor, media_insert, 1)

          media430 = '@media (max-width: 430px) {'
          media430_insert = '''@media (max-width: 430px) {\n  .sby-head h1 { font-size: 32px; }\n  .sby-stage-title h2 { font-size: 27px; }\n  .sby-extra { gap: 10px; padding: 14px; }\n  .sby-extra > button, .sby-extra > select { min-width: 82px; }\n  .sby-calendar-head { grid-template-columns: 34px 1fr 34px; }\n  .sby-calendar-head button { width: 32px; height: 32px; font-size: 20px; }\n  .sby-calendar-head strong { font-size: 17px; }\n  .sby-calendar-weekdays, .sby-calendar-grid { gap: 3px; }\n  .sby-calendar-day { border-radius: 8px; font-size: 12px; }\n'''
          if media430 not in styles:
              raise SystemExit('430 media anchor not found')
          styles = styles.replace(media430, media430_insert, 1)

          css.write_text(styles)
          PY

          rm .github/workflows/patch-sabrina-booking-polish-once.yml

      - name: Commit UI polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/SabrinaBookingJourney.tsx web/src/sabrinaBookingJourney.css .github/workflows/patch-sabrina-booking-polish-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: refinar agenda Sabrina e calendário'
          git push origin HEAD:fix/sabrina-booking-polish
