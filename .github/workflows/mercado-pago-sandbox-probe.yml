name: Mercado Pago Sandbox Credential Preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite SANDBOX para validar apenas credenciais de teste"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validar credencial Mercado Pago sandbox
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 5
    env:
      APP_ENV: staging
      MERCADO_PAGO_ENV: sandbox
      ALLOW_REAL_CHARGES: "false"
      ALLOW_REAL_CUSTOMER_DATA: "false"
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}

    steps:
      - name: Require explicit sandbox confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "SANDBOX" ]] || { echo "Confirmação inválida" >&2; exit 1; }
          [[ "$APP_ENV" == "staging" ]] || { echo "APP_ENV precisa ser staging" >&2; exit 1; }
          [[ "$MERCADO_PAGO_ENV" == "sandbox" ]] || { echo "MERCADO_PAGO_ENV precisa ser sandbox" >&2; exit 1; }
          [[ "$ALLOW_REAL_CHARGES" == "false" ]] || { echo "ALLOW_REAL_CHARGES precisa ser false" >&2; exit 1; }
          [[ "$ALLOW_REAL_CUSTOMER_DATA" == "false" ]] || { echo "ALLOW_REAL_CUSTOMER_DATA precisa ser false" >&2; exit 1; }
          [[ -n "${MERCADO_PAGO_ACCESS_TOKEN:-}" ]] || { echo "MERCADO_PAGO_ACCESS_TOKEN ausente" >&2; exit 1; }

      - name: Reject Mercado Pago live credential in sandbox
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MERCADO_PAGO_ACCESS_TOKEN" == TEST-* ]]; then
            echo "Mercado Pago sandbox credential preflight: TEST prefix accepted."
            exit 0
          fi

          status="$(curl --silent --show-error \
            --output /tmp/mp-user.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${MERCADO_PAGO_ACCESS_TOKEN}" \
            'https://api.mercadolibre.com/users/me')"
          if [[ "$status" != "200" ]]; then
            echo "Não foi possível validar a identidade da credencial Mercado Pago (HTTP $status)." >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/mp-user.json'))
          tags = data.get('tags') or []
          if 'test_user' not in tags:
              print('Credencial recusada: o environment sandbox não pode usar token associado a usuário produtivo.')
              raise SystemExit(1)
          print('Mercado Pago sandbox credential preflight: test_user confirmado.')
          PY

      - name: Record preflight evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercado Pago Sandbox Credential Preflight"
            echo
            echo "- Environment: \`sandbox\`"
            echo "- Real charges allowed: \`false\`"
            echo "- Real customer data allowed: \`false\`"
            echo "- No payment was created by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
