name: Sandbox Retired Email Probes

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/email-provider-probe/**'
      - 'supabase/functions/email-e2e-gate/**'
      - 'supabase/functions/email-live-status/**'
      - 'supabase/config.toml'
      - '.github/workflows/sandbox-retired-email-probes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-sandbox-retired-email-probes
  cancel-in-progress: false

jobs:
  tombstone:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 8
    env:
      APP_ENV: staging
      ALLOW_REAL_CUSTOMER_DATA: 'false'
      ALLOW_REAL_CHARGES: 'false'
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Require sandbox isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test "$ALLOW_REAL_CUSTOMER_DATA" = false
          test "$ALLOW_REAL_CHARGES" = false
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy retired probes from main
        shell: bash
        run: |
          set -euo pipefail
          for fn in email-provider-probe email-e2e-gate email-live-status; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Prove retired probes are inert
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          for fn in email-provider-probe email-e2e-gate email-live-status; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{}' "$base/$fn")"
            if [[ "$status" != "410" ]]; then
              echo "$fn is not tombstoned: HTTP $status" >&2
              cat "$body" >&2
              exit 1
            fi
          done

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Sandbox retired email probes'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Environment: `sandbox`'
            echo '- Real customer data: `false`'
            echo '- Real charges: `false`'
            echo '- `email-provider-probe`: required HTTP 410'
            echo '- `email-e2e-gate`: required HTTP 410'
            echo '- `email-live-status`: required HTTP 410'
            echo '- No email send/provider operation is permitted by these functions.'
          } >> "$GITHUB_STEP_SUMMARY"
