name: Mercado Pago Card HTTPS Staging Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/mercado-pago-card-staging/**'
      - 'scripts/mp-card-staging-e2e.mjs'
      - 'supabase/config.toml'
      - '.github/workflows/mercado-pago-card-staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-test:
    name: Deploy and test card staging
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
      MERCADO_PAGO_PUBLIC_KEY: ${{ secrets.MERCADO_PAGO_PUBLIC_KEY }}
      APP_ENV: staging
      MERCADO_PAGO_ENV: sandbox
      ALLOW_REAL_CHARGES: 'false'
      ALLOW_REAL_CUSTOMER_DATA: 'false'
      TARGET_URL: https://jlyvlvmspfjwbcmhmhwz.supabase.co/functions/v1/mercado-pago-card-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require sandbox credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN MERCADO_PAGO_ACCESS_TOKEN MERCADO_PAGO_PUBLIC_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name ausente no environment sandbox" >&2
              exit 1
            fi
          done
          [[ "$APP_ENV" == 'staging' ]]
          [[ "$MERCADO_PAGO_ENV" == 'sandbox' ]]
          [[ "$ALLOW_REAL_CHARGES" == 'false' ]]
          [[ "$ALLOW_REAL_CUSTOMER_DATA" == 'false' ]]

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure sandbox-only Edge secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            MERCADO_PAGO_ACCESS_TOKEN="$MERCADO_PAGO_ACCESS_TOKEN" \
            MERCADO_PAGO_PUBLIC_KEY="$MERCADO_PAGO_PUBLIC_KEY" \
            MERCADO_PAGO_ENV="$MERCADO_PAGO_ENV" \
            APP_ENV="$APP_ENV" \
            ALLOW_REAL_CHARGES="$ALLOW_REAL_CHARGES" \
            ALLOW_REAL_CUSTOMER_DATA="$ALLOW_REAL_CUSTOMER_DATA"

      - name: Deploy HTTPS card staging function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy mercado-pago-card-staging \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api

      - name: Smoke test HTTPS page
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$TARGET_URL")"
          [[ "$status" == '200' ]]
          grep -q 'MP_CARD_STAGING_READY' "$body"
          echo "HTTPS staging page is online: $TARGET_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mp-card-https
          cp scripts/mp-card-staging-e2e.mjs /tmp/mp-card-https/mp-card-staging-e2e.mjs
          cd /tmp/mp-card-https
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Approved card on HTTPS staging
        id: approved
        shell: bash
        env:
          CARDHOLDER_NAME: APRO
          EXPECTED_STATUS: processed
          EXPECTED_DETAIL: accredited
        run: |
          set -euo pipefail
          cd /tmp/mp-card-https
          node mp-card-staging-e2e.mjs | tee /tmp/mp-approved.log
          order_id="$(sed -n 's/.* order=\([^ ]*\)$/\1/p' /tmp/mp-approved.log | tail -1)"
          [[ -n "$order_id" ]]
          echo "order_id=$order_id" >> "$GITHUB_OUTPUT"

      - name: Rejected card on HTTPS staging
        id: rejected
        shell: bash
        env:
          CARDHOLDER_NAME: OTHE
          EXPECTED_STATUS: failed
          EXPECTED_DETAIL: failed
        run: |
          set -euo pipefail
          cd /tmp/mp-card-https
          node mp-card-staging-e2e.mjs | tee /tmp/mp-rejected.log
          order_id="$(sed -n 's/.* order=\([^ ]*\)$/\1/p' /tmp/mp-rejected.log | tail -1)"
          [[ -n "$order_id" ]]
          echo "order_id=$order_id" >> "$GITHUB_OUTPUT"

      - name: Record HTTPS card evidence
        shell: bash
        run: |
          {
            echo '## Mercado Pago Card HTTPS Staging'
            echo
            echo "- URL: $TARGET_URL"
            echo '- Provider: Mercado Pago Orders API'
            echo '- Amount: R$ 50,00 fixed'
            echo '- Real charges: disabled'
            echo '- Real customer data: disabled'
            echo '- Browser origin: HTTPS Supabase Edge Function'
            echo '- Card Payment Brick mount: PASS'
            echo '- Approved card APRO: PASS'
            echo '- Rejected card OTHE: PASS'
            echo '- Approved Order ID: `${{ steps.approved.outputs.order_id }}`'
            echo '- Rejected Order ID: `${{ steps.rejected.outputs.order_id }}`'
            echo '- Raw card/token logged: NO'
          } >> "$GITHUB_STEP_SUMMARY"
