name: Birthday Automation Sandbox Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/birthday-automation-trigger/**'
      - 'supabase/functions/birthday-email-worker/**'
      - 'supabase/functions/_shared/github-oidc.ts'
      - 'supabase/config.toml'
      - '.github/workflows/birthday-automation-sandbox-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: birthday-automation-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    env:
      APP_ENV: staging
      ALLOW_REAL_CUSTOMER_DATA: 'false'
      ALLOW_REAL_CHARGES: 'false'
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Require sandbox isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test "$ALLOW_REAL_CUSTOMER_DATA" = false
          test "$ALLOW_REAL_CHARGES" = false
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy isolated birthday functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy birthday-email-worker --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy birthday-automation-trigger --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Smoke fail-closed birthday boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/birthday-automation-trigger")"
          if [[ "$status" != '401' ]] || ! grep -q 'GITHUB_OIDC_REQUIRED' "$body"; then
            echo "birthday-automation-trigger OIDC smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/birthday-email-worker")"
          if [[ "$status" != '401' ]] || ! grep -q 'INTERNAL_AUTH_REQUIRED' "$body"; then
            echo "birthday-email-worker internal auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Birthday Automation Sandbox Deploy'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Ambiente: `staging`'
            echo '- Dados reais permitidos: `false`'
            echo '- Cobranças reais permitidas: `false`'
            echo '- Trigger: protegido por OIDC específico do workflow de aniversário'
            echo '- Consumer: protegido por segredo interno e gate adicional `BIRTHDAY_EMAIL_DELIVERY_ENABLED`'
            echo '- Provider: o deploy não habilita o gate de entrega e o smoke não chama Resend'
          } >> "$GITHUB_STEP_SUMMARY"
