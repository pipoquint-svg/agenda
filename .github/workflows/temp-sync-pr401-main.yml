name: Temp Sync PR401 With Main

on:
  push:
    branches:
      - feat/infinitepay-sabrina
    paths:
      - '.github/workflows/temp-sync-pr401-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/infinitepay-sabrina
          fetch-depth: 0
      - name: Merge current main without regressing Natal/frontend
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected_main='e81029cf2e6eff524014c3f0af97cce9cf7feefc'
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$expected_main"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git merge --no-ff --no-commit -X theirs origin/main

          # Runtime/frontend already certified on main; preserve main exactly here.
          git checkout origin/main -- \
            .github/workflows/web-core.yml \
            web/scripts/cutover-natal-wrapper-compat.mjs \
            web/src/InfinitePayPaymentPanel.tsx \
            web/src/MercadoPagoPaymentPanel.tsx \
            web/src/PaymentPanel.tsx \
            web/src/SabrinaBookingJourney.tsx \
            web/src/embed.tsx \
            web/src/infinitepayPaymentApi.ts \
            web/src/paymentProviderApi.ts

          git diff --check
          grep -Fq "const natalFlow = slug === 'natal-2026'" web/src/SabrinaBookingJourney.tsx
          grep -Fq "slug === 'sabrina' || slug === 'natal-2026'" web/src/embed.tsx
          grep -Fq 'infinitepay-payment' web/src/infinitepayPaymentApi.ts
          test -f supabase/functions/infinitepay-payment/index.ts
          test -f supabase/functions/infinitepay-return/index.ts
          test -f supabase/functions/infinitepay-webhook/index.ts
          test -f supabase/migrations/20260905190904_20260905160000_payment_provider_abstraction.sql

          git commit -m 'merge(main): sync PR #401 after Natal staged-flow fix'
          git push origin HEAD:feat/infinitepay-sabrina
