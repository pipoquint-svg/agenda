name: MP Browser Clean Validation

on:
  pull_request:
    paths:
      - .github/workflows/mp-browser-clean-validation.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_URL: https://blacksheep-agenda-staging.lovable.app/agenda-e-valores
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/mp-browser && cd /tmp/mp-browser
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: APRO and OTHE through staging
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/mp-browser/gate.mjs <<'EOF'
          import { chromium } from 'playwright';
          const U=process.env.STAGING_URL,CARD='5480832801033311',EXP='11/30',CVV='123';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function cpfFrom9(s){const d=s.replace(/\D/g,'').padStart(9,'0').slice(-9).split('').map(Number);let sum=d.reduce((a,n,i)=>a+n*(10-i),0),r=(sum*10)%11;if(r===10)r=0;d.push(r);sum=d.reduce((a,n,i)=>a+n*(11-i),0);r=(sum*10)%11;if(r===10)r=0;d.push(r);return d.join('')}
          function identity(name){const raw=String(Date.now())+(name==='APRO'?'1':'2');return {email:`mp-${name.toLowerCase()}-${raw}@example.com`,phone:`489${raw.slice(-8)}`,cpf:cpfFrom9(raw.slice(-9))}}
          async function clickVisible(page,name){const bs=page.getByRole('button',{name,exact:true});for(let i=0;i<await bs.count();i++){const b=bs.nth(i);if(await b.isVisible().catch(()=>false)&&await b.isEnabled().catch(()=>false)){await b.click();return true}}return false}
          async function chooseAndHold(page){const days=page.locator('button[role="gridcell"]:not([disabled])');await days.first().waitFor({state:'visible',timeout:30000});const max=Math.min(await days.count(),24);for(let d=0;d<max;d++){const day=days.nth(d);if(!await day.isVisible().catch(()=>false))continue;await day.click().catch(()=>{});await sleep(800);const times=page.getByRole('button',{name:/^\d{2}:\d{2}$/});for(let i=0;i<await times.count();i++){const t=times.nth(i);if(!await t.isVisible().catch(()=>false)||!await t.isEnabled().catch(()=>false))continue;await t.click();const reserve=page.getByRole('button',{name:'Reservar este horário'});if(!await reserve.isEnabled().catch(()=>false))continue;await reserve.click();for(let n=0;n<24;n++){if(await page.getByText(/Horário reservado temporariamente para você por/i).isVisible().catch(()=>false)||await page.getByText(/Quantas pessoas estarão no estúdio/i).isVisible().catch(()=>false)||await page.getByText('Seus dados',{exact:true}).isVisible().catch(()=>false))return;const retry=page.getByRole('button',{name:/Tentar novamente/i});if(await retry.isVisible().catch(()=>false)){await retry.click().catch(()=>{});await sleep(500);break}await sleep(250)}}}throw new Error('NO_HOLD_ACQUIRED')}
          async function advanceToCustomer(page){for(let i=0;i<10;i++){if(await page.getByText('Seus dados',{exact:true}).isVisible().catch(()=>false))return;if(await clickVisible(page,'Continuar')){await sleep(650);continue}await sleep(500)}throw new Error('CUSTOMER_STEP_NOT_REACHED')}
          async function fillCustomer(page,name,id){const inputs=page.locator('input');const visible=[];for(let i=0;i<await inputs.count();i++){const e=inputs.nth(i);if(await e.isVisible().catch(()=>false))visible.push(e)}if(visible.length<4)throw new Error(`CUSTOMER_FIELDS_MISSING_${visible.length}`);await visible[0].fill(`TESTE HTTPS ${name}`);await visible[1].fill(id.email);await visible[2].fill(id.phone);await visible[3].fill(id.cpf);const btn=page.getByRole('button',{name:/Continuar para a revisão/i});for(let i=0;i<await btn.count();i++){const b=btn.nth(i);if(await b.isVisible().catch(()=>false)&&await b.isEnabled().catch(()=>false)){await b.click();return}}throw new Error('NO_REVIEW_CONTINUE')}
          async function fillReview(page){for(const e of await page.locator('input[type=checkbox]').all())if(await e.isVisible().catch(()=>false)&&await e.isEnabled().catch(()=>false)&&!await e.isChecked().catch(()=>false))await e.check();for(const e of await page.locator('textarea').all())if(await e.isVisible().catch(()=>false)&&!(await e.inputValue()).trim())await e.fill('Teste HTTPS Mercado Pago');for(const e of await page.locator('select').all())if(await e.isVisible().catch(()=>false)){const o=await e.locator('option').evaluateAll(ns=>ns.map(x=>({v:x.value,d:x.disabled})).filter(x=>x.v&&!x.d));if(o[0])await e.selectOption(o[0].v)}}
          async function submitReview(page){const all=page.getByRole('button');const labels=[];for(let i=0;i<await all.count();i++){const b=all.nth(i);if(!await b.isVisible().catch(()=>false)||!await b.isEnabled().catch(()=>false))continue;const text=(await b.innerText().catch(()=>'' )).trim();labels.push(text);if(/pagar|pagamento|confirmar|reservar|finalizar|continuar/i.test(text)&&!/voltar|tentar novamente|reserve agora/i.test(text)){await b.click();return}}console.log('REVIEW_VISIBLE_BUTTONS='+JSON.stringify(labels));throw new Error('NO_REVIEW_SUBMIT')}
          function cls(m,u){const s=`${m.name} ${m.id} ${m.placeholder} ${m.autocomplete} ${m.aria} ${u}`.toLowerCase();if(/card.?number|cc-number|numero.*cart|número.*cart|cardnumber/.test(s))return'number';if(/expiration|expiry|expir|cc-exp|validade/.test(s))return'expiration';if(/security|cvv|cvc|cc-csc|segurança|securitycode/.test(s))return'cvv';if(/cardholder|holder|titular|nome.*cart/.test(s))return'holder';if(/document|identification|cpf/.test(s))return'document';if(/e-?mail/.test(s))return'email';return null}
          async function meta(e){return e.evaluate(x=>({name:x.getAttribute('name')||'',id:x.id||'',placeholder:x.getAttribute('placeholder')||'',autocomplete:x.getAttribute('autocomplete')||'',aria:x.getAttribute('aria-label')||''}))}
          async function fillBrick(page,name,id){if(await page.getByText('Pagamento com cartão indisponível no momento',{exact:false}).isVisible().catch(()=>false))throw new Error('PUBLIC_KEY_UNAVAILABLE');const end=Date.now()+60000;let f=new Set();while(Date.now()<end){f=new Set();for(const frame of page.frames()){try{const ins=frame.locator('input');for(let i=0;i<await ins.count();i++){const e=ins.nth(i);if(!await e.isVisible().catch(()=>false))continue;const k=cls(await meta(e),frame.url());if(!k||f.has(k))continue;if(k==='number')await e.fill(CARD);if(k==='expiration')await e.fill(EXP);if(k==='cvv')await e.fill(CVV);if(k==='holder')await e.fill(name);if(k==='document')await e.fill(id.cpf);if(k==='email')await e.fill(id.email);f.add(k)}}catch{}}if(f.has('number')&&f.has('expiration')&&f.has('cvv')&&f.has('holder')){for(const frame of page.frames()){try{const bs=frame.getByRole('button',{name:/pagar|pay|continuar|processar|confirmar/i});for(let i=0;i<await bs.count();i++){const b=bs.nth(i);if(await b.isVisible().catch(()=>false)&&await b.isEnabled().catch(()=>false)){await b.click();return}}}catch{}}}await sleep(500)}console.log('BRICK_FIELDS='+[...f].join(','));throw new Error('BRICK_NOT_READY')}
          async function reach(page,name,id){await page.goto(U,{waitUntil:'domcontentloaded',timeout:60000});await page.getByText('Quanto tempo você precisa no estúdio?',{exact:false}).waitFor({timeout:30000});if(!await clickVisible(page,'Continuar'))throw new Error('NO_CONTINUE_DURATION');await page.getByText('Data e horário',{exact:true}).waitFor({timeout:30000});await chooseAndHold(page);await advanceToCustomer(page);await fillCustomer(page,name,id);await page.getByText(/Revisão/i).first().waitFor({timeout:30000});await fillReview(page);await submitReview(page);await page.getByText('Pagamento',{exact:true}).waitFor({timeout:30000});const cards=page.getByRole('button',{name:'Cartão'});let clicked=false;for(let i=0;i<await cards.count();i++){const b=cards.nth(i);if(await b.isVisible().catch(()=>false)&&await b.isEnabled().catch(()=>false)){await b.click();clicked=true;break}}if(!clicked)throw new Error('CARD_OPTION_NOT_AVAILABLE');await page.waitForTimeout(4000)}
          async function scenario(name){const id=identity(name);const b=await chromium.launch({headless:false});const p=await b.newPage({viewport:{width:1280,height:1000}});p.on('response',async r=>{if(r.status()>=400&&/supabase|functions|mercado/i.test(r.url()))console.log(`HTTP_ERROR ${r.status()} ${r.url()} ${(await r.text().catch(()=>'' )).slice(0,800)}`)});try{await reach(p,name,id);await fillBrick(p,name,id);if(name==='APRO'){await p.getByText(/reserva está confirmada|Reserva confirmada/i).first().waitFor({timeout:60000});console.log('APRO_BROWSER_HTTPS=PASS')}else{await p.getByText(/Mercado Pago recusou|Pagamento recusado/i).first().waitFor({timeout:60000});console.log('OTHE_BROWSER_HTTPS=PASS')}await p.screenshot({path:`/tmp/mp-browser/${name.toLowerCase()}-final.png`,fullPage:true})}catch(e){console.log(`${name}_PAGE_TEXT=`+((await p.locator('body').innerText().catch(()=>'' )).slice(0,7000)));await p.screenshot({path:`/tmp/mp-browser/${name.toLowerCase()}-failure.png`,fullPage:true}).catch(()=>{});throw e}finally{await b.close()}}
          await scenario('APRO');
          await scenario('OTHE');
          EOF
          cd /tmp/mp-browser && xvfb-run -a node gate.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp-browser-clean-validation
          path: /tmp/mp-browser/*.png
          if-no-files-found: ignore
