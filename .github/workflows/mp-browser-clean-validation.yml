name: MP Browser Clean Validation

on:
  pull_request:
    paths:
      - .github/workflows/mp-browser-clean-validation.yml
      - scripts/mp-browser-clean-gate.mjs

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_URL: https://blacksheep-agenda-staging.lovable.app/agenda-e-valores
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: APRO and OTHE through staging
        run: xvfb-run -a node scripts/mp-browser-clean-gate.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp-browser-clean-validation
          path: /tmp/mp-browser/*.png
          if-no-files-found: ignore
