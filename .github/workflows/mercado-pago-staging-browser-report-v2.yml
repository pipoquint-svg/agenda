name: Mercado Pago Staging Browser Report V2

on:
  workflow_run:
    workflows: ["Mercado Pago Staging Browser Gate V2"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Record auditable browser-gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 73 --repo pipoquint-svg/agenda --body "$(cat <<EOF
          ## Mercado Pago — browser HTTPS staging V2

          - run_id: \`${RUN_ID}\`
          - conclusion: **${CONCLUSION}**
          - SHA: \`${HEAD_SHA}\`
          - URL do run: ${RUN_URL}
          - jornada: Tempo → Data/Horário → Pessoas → Extras → Dados → Revisão → Pagamento
          - escopo: APRO + OTHE, sandbox e dados sintéticos somente
          - backend/provider alterado para este teste: **NÃO**

          **Resultado registrado automaticamente para auditoria do gate STAGING_BROWSER.**
          EOF
          )"
