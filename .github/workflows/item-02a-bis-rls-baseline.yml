name: Item 2A-bis RLS Baseline

on:
  push:
    branches:
      - fix/item-02a-bis-rls-baseline
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260902190000_reconcile_public_rls_baseline.sql'
      - 'scripts/rls-inventory.sql'
      - 'tests/rls-parity/production_rls_baseline.txt'
      - '.github/workflows/item-02a-bis-rls-baseline.yml'
      - 'docs/item-02a-bis-rls-baseline.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild strictly from migrations
        run: supabase db reset

      - name: Compare complete public RLS state with production baseline
        shell: bash
        run: |
          set -euo pipefail
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 -q -f scripts/rls-inventory.sql \
            | sed '/^[[:space:]]*$/d' > /tmp/local-rls-baseline.txt
          diff -u tests/rls-parity/production_rls_baseline.txt /tmp/local-rls-baseline.txt \
            | tee /tmp/rls-parity.diff
          test ! -s /tmp/rls-parity.diff

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
