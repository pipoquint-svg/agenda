name: Database Core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  core-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge helpers
        run: |
          deno test supabase/functions/_shared/action-token-security_test.ts
          deno test --allow-env supabase/functions/_shared/google_test.ts
          deno test supabase/functions/_shared/github-oidc_test.ts
          deno test supabase/functions/_shared/kommo_test.ts
          deno test supabase/functions/_shared/managed-event_test.ts
          deno test supabase/functions/_shared/mercado-pago_test.ts
          deno test supabase/functions/_shared/mercado-pago-webhook-signature-regression_test.ts
          deno test supabase/functions/_shared/mercado-pago-runtime_test.ts
          deno test supabase/functions/_shared/public-rate-limit_test.ts
          deno test supabase/functions/_shared/transactional-email_test.ts

      - name: Type-check every Edge Function
        run: |
          mapfile -d '' edge_files < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 | sort -z)
          if [[ ${#edge_files[@]} -eq 0 ]]; then
            echo "No Edge Functions found" >&2
            exit 1
          fi
          printf 'Type-checking %d Edge Functions\n' "${#edge_files[@]}"
          for file in "${edge_files[@]}"; do
            echo "::group::deno check ${file}"
            deno check "${file}"
            echo "::endgroup::"
          done

      - name: Gate autonomous expiry wiring
        run: |
          grep -Fq "client.rpc('expire_due_appointment_holds')" supabase/functions/integration-worker/index.ts
          grep -Fq "client.rpc('expire_unconfirmed_free_visits')" supabase/functions/integration-worker/index.ts
          grep -Fq "PAYMENT_AFTER_EXPIRATION" supabase/tests/database/009_payment_state_machine.test.sql

      - name: Gate Mercado Pago financial mutations
        run: |
          charge_file='supabase/functions/mercado-pago-payment/index.ts'
          refund_file='supabase/functions/admin-appointment-actions/index.ts'
          cancel_file='supabase/functions/balance-collection-provider-cancel/index.ts'

          grep -Fq "import { mercadoPagoRuntime }" "$charge_file"
          grep -Fq 'function providerRuntime(options: { creatingCharge?: boolean } = {})' "$charge_file"
          grep -Fq 'creatingCharge: options.creatingCharge === true' "$charge_file"
          grep -Fq 'authorization: `Bearer ${runtime.accessToken}`' "$charge_file"
          grep -Fq '}, { creatingCharge: true })' "$charge_file"
          if grep -Fq "requiredEnv('MERCADO_PAGO_ACCESS_TOKEN')" "$charge_file"; then
            echo 'Order charge path bypasses the environment-scoped Mercado Pago runtime guard.' >&2
            exit 1
          fi

          grep -Fq "import { mercadoPagoRuntime }" "$refund_file"
          grep -Fq 'function providerFinancialMutationRuntime()' "$refund_file"
          grep -Fq 'creatingCharge: true' "$refund_file"
          grep -Fq 'authorization: `Bearer ${runtime.accessToken}`' "$refund_file"
          if grep -Fq "requiredEnv('MERCADO_PAGO_ACCESS_TOKEN')" "$refund_file"; then
            echo 'Admin refund path bypasses the environment-scoped Mercado Pago runtime guard.' >&2
            exit 1
          fi

          grep -Fq "import { mercadoPagoRuntime }" "$cancel_file"
          grep -Fq "sandboxAccessToken: Deno.env.get('MERCADO_PAGO_SANDBOX_ACCESS_TOKEN')" "$cancel_file"
          grep -Fq "productionAccessToken: Deno.env.get('MERCADO_PAGO_PRODUCTION_ACCESS_TOKEN')" "$cancel_file"
          grep -Fq 'creatingCharge: true' "$cancel_file"
          grep -Fq 'authorization: `Bearer ${runtime.accessToken}`' "$cancel_file"
          if grep -Fq 'creatingCharge: false' "$cancel_file"; then
            echo 'Provider cancellation path bypasses the financial-mutation production gate.' >&2
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run Gate A concurrency test
        run: bash scripts/test-concurrency.sh

      - name: Run pre-reservation concurrency test
        run: bash scripts/test-pre-reservation-concurrency.sh

      - name: Run package balance concurrency test
        run: bash scripts/test-package-concurrency.sh

      - name: Run distributed rate-limit concurrency test
        run: bash scripts/test-rate-limit-concurrency.sh

      # The HTTP gate intentionally creates action-token/access evidence. Give it a
      # fresh disposable DB after all authoritative suites so neither side can leak
      # state into the other. The runner is destroyed immediately afterwards.
      - name: Reset disposable stack for action-token HTTP gate
        run: supabase db reset

      - name: Run action-token HTTP gate in disposable local stack
        run: bash scripts/test-action-token-http-ephemeral.sh

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi
