name: Database Core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  core-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge helpers
        run: |
          deno test --allow-env supabase/functions/_shared/google_test.ts
          deno test supabase/functions/_shared/managed-event_test.ts
          deno test supabase/functions/_shared/whatsapp_test.ts

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/google-oauth/index.ts
          deno check supabase/functions/google-sync/index.ts
          deno check supabase/functions/google-webhook/index.ts
          deno check supabase/functions/google-watch/index.ts
          deno check supabase/functions/google-appointment-sync/index.ts
          deno check supabase/functions/whatsapp-send-template/index.ts
          deno check supabase/functions/integration-worker/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run Gate A concurrency test
        run: bash scripts/test-concurrency.sh

      - name: Run package balance concurrency test
        run: bash scripts/test-package-concurrency.sh

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi
