name: TMP Mercado Pago Browser System Chrome
on:
  push:
    branches: [test/mp-browser-direct-current]
    paths: [.github/workflows/tmp-mp-browser-system-chrome.yml]
permissions:
  contents: write
env:
  STAGING_URL: https://blacksheep-agenda-staging.lovable.app/agenda-e-valores
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner Chrome
        run: |
          set -euo pipefail
          mkdir -p evidence /tmp/mp-browser
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          [[ -n "$chrome" ]]
          echo "$chrome" > evidence/chrome-path.txt
          cd /tmp/mp-browser
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
      - name: Run APRO and OTHE
        run: |
          set +e
          CHROME_PATH=$(cat evidence/chrome-path.txt)
          export CHROME_PATH
          NODE_PATH=/tmp/mp-browser/node_modules xvfb-run -a node "$GITHUB_WORKSPACE/scripts/tmp-mp-browser-current.mjs" > "$GITHUB_WORKSPACE/evidence/mp-browser-run.log" 2>&1
          code=$?
          cat "$GITHUB_WORKSPACE/evidence/mp-browser-run.log"
          exit $code
      - name: Persist evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p evidence
          printf '{"gate":"browser_https_current_system_chrome","status":"%s","sha":"%s","staging":"%s","real_charges":false,"real_customer_data":false}\n' "$JOB_STATUS" "$GITHUB_SHA" "$STAGING_URL" > evidence/mp-browser-system-chrome.json
          cp /tmp/mp-browser/*.png evidence/ 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add evidence
          git commit -m 'test: registrar browser gate system chrome' || true
          git push
