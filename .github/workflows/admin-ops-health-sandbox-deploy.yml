name: Admin Ops Health Sandbox Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-ops-health/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/admin-ops-health-sandbox-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ops-health-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    env:
      APP_ENV: staging
      ALLOW_REAL_CUSTOMER_DATA: 'false'
      ALLOW_REAL_CHARGES: 'false'
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Require sandbox isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test "$ALLOW_REAL_CUSTOMER_DATA" = false
          test "$ALLOW_REAL_CHARGES" = false
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check endpoint
        run: deno check supabase/functions/admin-ops-health/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy read-only endpoint
        run: supabase functions deploy admin-ops-health --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Smoke fail-closed admin boundary
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --request GET "$base/admin-ops-health")"
          if [[ "$status" != '401' ]] || ! grep -Eq 'ADMIN_AUTH_REQUIRED|UNAUTHORIZED_NO_AUTH_HEADER' "$body"; then
            echo "admin-ops-health auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Admin Ops Health Sandbox Deploy'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Endpoint: read-only, protegido por `INTEGRATIONS_VIEW`'
            echo '- Dados reais permitidos: `false`'
            echo '- Cobranças reais permitidas: `false`'
            echo '- Nenhuma flag LIVE ou provider é alterado por este workflow'
          } >> "$GITHUB_STEP_SUMMARY"
