name: Google Admin Sandbox Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-google/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/20260825183000_google_admin_mapping.sql'
      - '.github/workflows/google-admin-sandbox-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-admin-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    env:
      APP_ENV: staging
      ALLOW_REAL_CUSTOMER_DATA: 'false'
      ALLOW_REAL_CHARGES: 'false'
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Require sandbox isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test "$ALLOW_REAL_CUSTOMER_DATA" = false
          test "$ALLOW_REAL_CHARGES" = false
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy admin-google
        shell: bash
        run: supabase functions deploy admin-google --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Smoke fail-closed admin boundary
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --request GET "$base/admin-google")"
          if [[ "$status" != "401" ]] || ! grep -q 'ADMIN_AUTH_REQUIRED' "$body"; then
            echo "admin-google auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi
