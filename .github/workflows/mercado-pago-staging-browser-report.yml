name: Mercado Pago Staging Browser Report

on:
  workflow_run:
    workflows: ["Mercado Pago Staging Browser Gate"]
    types: [completed]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Comment Gate #73
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const body = [
              '## Mercado Pago — browser HTTPS staging',
              '',
              `- run_id: \`${run.id}\``,
              `- conclusion: **${run.conclusion}**`,
              `- SHA: \`${run.head_sha}\``,
              `- URL do run: ${run.html_url}`,
              '- staging: `https://blacksheep-agenda-staging.lovable.app/agenda-e-valores`',
              '- escopo: APRO + OTHE no navegador, sandbox somente',
              '',
              run.conclusion === 'success'
                ? '**STAGING_BROWSER cartão comum: PASS**'
                : '**STAGING_BROWSER cartão comum: FAIL — inspecionar job/log antes de qualquer nova tentativa.**'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 73, body});
