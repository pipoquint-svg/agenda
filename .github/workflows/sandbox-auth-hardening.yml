name: Sandbox Auth Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandbox-auth-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-sandbox-auth-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 5
    env:
      APP_ENV: staging
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EXPECTED_SITE_URL: https://blacksheep-agenda-staging.lovable.app
      EXPECTED_URI_ALLOW_LIST: https://blacksheep-agenda-staging.lovable.app/gestao,https://blacksheep-agenda-staging.lovable.app/**
    steps:
      - name: Require sandbox isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$EXPECTED_SITE_URL" = 'https://blacksheep-agenda-staging.lovable.app'

      - name: Apply baseline Auth hardening
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg site "$EXPECTED_SITE_URL" \
            --arg allow "$EXPECTED_URI_ALLOW_LIST" \
            '{site_url:$site,uri_allow_list:$allow,password_min_length:12}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Attempt leaked-password protection separately
        id: hibp
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request PATCH \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"password_hibp_enabled":true}')"
          case "$status" in
            200)
              echo 'state=ENABLED' >> "$GITHUB_OUTPUT"
              ;;
            402)
              echo 'state=PLAN_GATED' >> "$GITHUB_OUTPUT"
              echo 'Leaked-password protection is unavailable on the current Supabase plan.' >&2
              ;;
            *)
              echo "Unexpected HIBP configuration response: HTTP $status" >&2
              cat "$body" >&2
              exit 1
              ;;
          esac

      - name: Verify expected safe Auth fields
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --output "$response"
          test "$(jq -r '.site_url' "$response")" = "$EXPECTED_SITE_URL"
          test "$(jq -r '.uri_allow_list' "$response")" = "$EXPECTED_URI_ALLOW_LIST"
          test "$(jq -r '.password_min_length' "$response")" = 12
          if [[ '${{ steps.hibp.outputs.state }}' = 'ENABLED' ]]; then
            test "$(jq -r '.password_hibp_enabled' "$response")" = true
          else
            test '${{ steps.hibp.outputs.state }}' = 'PLAN_GATED'
          fi
          jq '{site_url,uri_allow_list,password_hibp_enabled,password_min_length}' "$response" | tee safe-auth-config.json

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Sandbox Auth Hardening'
            echo
            echo '- Environment: `sandbox`'
            echo '- Site URL: staging canônico'
            echo '- Redirect allowlist: `/gestao` + staging wildcard'
            echo '- Minimum password length: required `12`'
            echo "- Leaked password protection: `${{ steps.hibp.outputs.state || 'NOT_RUN' }}`"
            echo '- External OAuth/provider settings: not included in PATCH'
            if [[ -f safe-auth-config.json ]]; then
              echo
              echo '```json'
              cat safe-auth-config.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
