name: Email LIVE Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-live-runtime-deploy.yml'

permissions:
  contents: read
  issues: write

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Require Supabase access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Preflight required secret names
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
          for name in RESEND_API_KEY INTEGRATION_INTERNAL_SECRET EMAIL_FROM_BLACKSHEEP EMAIL_REPLY_TO_BLACKSHEEP; do
            if ! grep -q "$name" <<<"$secrets"; then
              echo "Required Supabase secret missing: $name" >&2
              exit 1
            fi
          done

      - name: Activate BlackSheep transactional email LIVE
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            TRANSACTIONAL_EMAIL_ENABLED=true \
            TRANSACTIONAL_EMAIL_WORKER_ENABLED=true \
            TRANSACTIONAL_EMAIL_SCOPES=BLACKSHEEP \
            ALLOW_REAL_EMAIL_RECIPIENTS=true

      - name: Deploy temporary safe status probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/email-live-status
          cat > supabase/functions/email-live-status/index.ts <<'TS'
          function enabled(name: string): boolean {
            return (Deno.env.get(name) ?? '').trim().toLowerCase() === 'true'
          }
          Deno.serve(() => Response.json({
            transactional_email_enabled: enabled('TRANSACTIONAL_EMAIL_ENABLED'),
            transactional_email_worker_enabled: enabled('TRANSACTIONAL_EMAIL_WORKER_ENABLED'),
            allow_real_email_recipients: enabled('ALLOW_REAL_EMAIL_RECIPIENTS'),
            blacksheep_scope_enabled: (Deno.env.get('TRANSACTIONAL_EMAIL_SCOPES') ?? '')
              .split(',').map((x) => x.trim().toUpperCase()).includes('BLACKSHEEP'),
            resend_api_key_present: Boolean(Deno.env.get('RESEND_API_KEY')),
            internal_secret_present: Boolean(Deno.env.get('INTEGRATION_INTERNAL_SECRET')),
            sender_present: Boolean(Deno.env.get('EMAIL_FROM_BLACKSHEEP')),
          }))
          TS
          supabase functions deploy email-live-status --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Verify LIVE flags in Edge runtime
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/email-live-status"
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$url")"
          cat "$body"
          echo
          test "$status" = '200'
          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          required = [
              'transactional_email_enabled',
              'transactional_email_worker_enabled',
              'allow_real_email_recipients',
              'blacksheep_scope_enabled',
              'resend_api_key_present',
              'internal_secret_present',
              'sender_present',
          ]
          missing = [key for key in required if data.get(key) is not True]
          if missing:
              raise SystemExit('LIVE verification failed: ' + ', '.join(missing))
          print('Email LIVE runtime flags verified.')
          PY

      - name: Tombstone temporary status probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/email-live-status
          cat > supabase/functions/email-live-status/index.ts <<'TS'
          Deno.serve(() => new Response(JSON.stringify({ error: 'GONE' }), {
            status: 410,
            headers: { 'content-type': 'application/json; charset=utf-8' },
          }))
          TS
          supabase functions deploy email-live-status --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Record evidence in issue 134
        if: always()
        shell: bash
        run: |
          {
            echo '## Email LIVE activation'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- `TRANSACTIONAL_EMAIL_ENABLED=true`'
            echo '- `TRANSACTIONAL_EMAIL_WORKER_ENABLED=true`'
            echo '- `ALLOW_REAL_EMAIL_RECIPIENTS=true`'
            echo '- `TRANSACTIONAL_EMAIL_SCOPES=BLACKSHEEP`'
            echo '- Edge runtime probe validated provider, worker, real recipients, scope and required secret presence.'
            echo '- Temporary status probe tombstoned after verification.'
            echo '- Pre-activation integration queue was empty.'
          } > /tmp/evidence.md
          gh issue comment 134 --repo pipoquint-svg/agenda --body-file /tmp/evidence.md
