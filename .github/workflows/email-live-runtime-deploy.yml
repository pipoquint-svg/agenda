name: Email LIVE Runtime Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-live-runtime-deploy.yml'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Require Supabase access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy email LIVE runtime functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in email-send integration-worker integration-worker-trigger mercado-pago-webhook; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Smoke custom-auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/integration-worker-trigger")"
          if [[ "$status" != '401' ]] || ! grep -q 'GITHUB_OIDC_REQUIRED' "$body"; then
            echo "integration-worker-trigger auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            "$base/email-send")"
          if [[ "$status" != '401' ]] || ! grep -q 'INTERNAL_AUTH_REQUIRED' "$body"; then
            echo "email-send internal auth smoke failed: HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

      - name: Record evidence in issue 134
        if: always()
        shell: bash
        run: |
          {
            echo '## Email LIVE runtime deploy'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Source: authoritative `main`'
            echo '- Functions: `email-send`, `integration-worker`, `integration-worker-trigger`, `mercado-pago-webhook`'
            echo '- OIDC trigger without token: expected `401` smoke'
            echo '- email-send without internal secret: expected `401` smoke'
            echo '- LIVE recipient/worker flags were not changed by this deploy.'
          } > /tmp/evidence.md
          gh issue comment 134 --repo pipoquint-svg/agenda --body-file /tmp/evidence.md
