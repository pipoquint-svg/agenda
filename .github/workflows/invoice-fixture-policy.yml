name: Complete invoice regression fixture
on:
  push:
    branches: [fix/invoice-prebook-checkout-20260921]
    paths: [.github/workflows/invoice-fixture-policy.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/invoice-prebook-checkout-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Add the same mandatory policy used by canonical service fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/tests/database/160_invoice_prebook_checkout.test.sql')
          s=p.read_text()
          anchor='insert into public.service_employees(id,service_id,employee_id)'
          assert s.count(anchor)==1
          addition="insert into public.service_change_policies(service_id,notice_hours,reschedule_first_early_percent,reschedule_first_late_percent,reschedule_repeat_percent,cancellation_late_percent)\nvalues('16000000-0000-4000-8000-000000000013',0,0,0,0,0);\n"
          p.write_text(s.replace(anchor,addition+anchor))
          PY
          git rm .github/workflows/invoice-fixture-policy.yml
          git add supabase/tests/database/160_invoice_prebook_checkout.test.sql
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: include required service policy in invoice lifecycle fixture'
          git push origin HEAD:refs/heads/fix/invoice-prebook-checkout-20260921
