name: Email Worker Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-worker-dispatch-once.yml'

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: pipoquint-svg/agenda
      WORKFLOW: integration-worker-schedule.yml
    steps:
      - name: Dispatch permanent integration worker workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$WORKFLOW" --repo "$REPO" --ref main

          run_id=''
          for _ in $(seq 1 20); do
            candidate="$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ -n "$candidate" && "$candidate" != '0' && "$candidate" != "$previous" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo 'Dispatched workflow run was not observed.' >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$REPO" --exit-status

      - name: Record successful LIVE worker evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.dispatch.outputs.run_id }}'
          summary="$(gh run view "$run_id" --repo "$REPO" --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt)"
          {
            echo '## Email LIVE — worker OIDC verificado'
            echo
            echo "- Workflow permanente: \`integration-worker-schedule.yml\`"
            echo "- Run ID: \`${run_id}\`"
            echo '- Evento: `workflow_dispatch` (mesma rota OIDC permitida pelo scheduler)'
            echo '- Resultado: `success`'
            echo '- O workflow permanente exige resposta HTTP `200` e `"ok":true` do `integration-worker-trigger`; portanto o sucesso comprova GitHub OIDC → trigger Supabase → `integration-worker`.'
            echo '- Resumo GitHub:'
            echo '```json'
            echo "$summary"
            echo '```'
          } > /tmp/evidence.md
          gh issue comment 134 --repo "$REPO" --body-file /tmp/evidence.md
