name: Apply payment discount and installments patch

on:
  push:
    branches:
      - fix/payment-discount-and-installments

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[payment-policy-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-discount-and-installments
          fetch-depth: 0

      - name: Apply focused backend patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "supabase/functions/_shared/mercado-pago.ts",
              "if (!Number.isInteger(installments) || installments < 1 || installments > 24) throw new Error('CARD_INSTALLMENTS_INVALID')",
              "if (!Number.isInteger(installments) || installments < 1 || installments > 6) throw new Error('CARD_INSTALLMENTS_INVALID')",
          )

          replace_once(
              "supabase/functions/mercado-pago-payment/index.ts",
              '''      if (settingsError) throw new Error('PAYMENT_SETTINGS_LOAD_FAILED')\n\n      const providerReady = providerPaymentsConfigured()''',
              '''      if (settingsError) throw new Error('PAYMENT_SETTINGS_LOAD_FAILED')\n\n      let minimumPixDue: number | null = null\n      if (context.minimum_available) {\n        const { data: minimumPixAmounts, error: minimumPixError } = await client.rpc('service_calculate_payment_cash_amount', {\n          p_contract_amount: context.minimum_due_contract_amount,\n          p_method: 'PIX',\n          p_pix_discount_percent: settings.pix_discount_percent,\n        })\n        if (minimumPixError) throw new Error('PAYMENT_PIX_AMOUNT_CALCULATION_FAILED')\n        const value = Number((minimumPixAmounts as Record<string, unknown> | null)?.cash_amount)\n        if (!Number.isFinite(value)) throw new Error('PAYMENT_PIX_AMOUNT_CALCULATION_FAILED')\n        minimumPixDue = value\n      }\n\n      let fullPixDue: number | null = null\n      if (context.full_available) {\n        const { data: fullPixAmounts, error: fullPixError } = await client.rpc('service_calculate_payment_cash_amount', {\n          p_contract_amount: context.contract_balance,\n          p_method: 'PIX',\n          p_pix_discount_percent: settings.pix_discount_percent,\n        })\n        if (fullPixError) throw new Error('PAYMENT_PIX_AMOUNT_CALCULATION_FAILED')\n        const value = Number((fullPixAmounts as Record<string, unknown> | null)?.cash_amount)\n        if (!Number.isFinite(value)) throw new Error('PAYMENT_PIX_AMOUNT_CALCULATION_FAILED')\n        fullPixDue = value\n      }\n\n      const providerReady = providerPaymentsConfigured()''',
          )

          replace_once(
              "supabase/functions/mercado-pago-payment/index.ts",
              '''          minimum_due_contract_amount: context.minimum_due_contract_amount,\n          minimum_available: context.minimum_available,\n          full_available: context.full_available,\n          pix_discount_percent: settings.pix_discount_percent,''',
              '''          minimum_due_contract_amount: context.minimum_due_contract_amount,\n          minimum_pix_due: minimumPixDue,\n          full_pix_due: fullPixDue,\n          minimum_available: context.minimum_available,\n          full_available: context.full_available,\n          pix_discount_percent: settings.pix_discount_percent,''',
          )

          Path(".github/workflows/apply-payment-discount-and-installments.yml").unlink()
          PY

      - name: Verify source contract
        shell: bash
        run: |
          grep -q "installments > 6" supabase/functions/_shared/mercado-pago.ts
          grep -q "minimum_pix_due: minimumPixDue" supabase/functions/mercado-pago-payment/index.ts
          grep -q "full_pix_due: fullPixDue" supabase/functions/mercado-pago-payment/index.ts

      - name: Commit patched backend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/mercado-pago-payment/index.ts supabase/functions/_shared/mercado-pago.ts .github/workflows/apply-payment-discount-and-installments.yml
          git commit -m "fix: expose PIX discounted amounts and cap cards at 6x [payment-policy-patched]"
          git push origin HEAD:fix/payment-discount-and-installments
