name: MP Current Main Remote Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dispatch and wait official Mercado Pago browser gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mercado-pago-staging-browser-gate.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run mercado-pago-staging-browser-gate.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=""
          for i in $(seq 1 30); do
            candidate=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mercado-pago-staging-browser-gate.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [[ "$candidate" != "0" && "$candidate" != "$before" ]]; then run_id="$candidate"; break; fi
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo "Official browser run not found" >&2; exit 1; }
          echo "OFFICIAL_BROWSER_RUN_ID=$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
