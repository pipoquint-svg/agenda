name: Preprod Consolidated Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/preprod-consolidated-audit.sh'
      - '.github/workflows/preprod-consolidated-audit.yml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/tests/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: staging
  ALLOW_REAL_CUSTOMER_DATA: 'false'
  ALLOW_REAL_CHARGES: 'false'

jobs:
  consolidated-audit:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 20
    env:
      SANDBOX_DATABASE_URL: ${{ secrets.SANDBOX_DATABASE_URL }}

    steps:
      - name: Checkout full working tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require sandbox-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = staging
          test "$ALLOW_REAL_CUSTOMER_DATA" = false
          test "$ALLOW_REAL_CHARGES" = false
          test -n "${SANDBOX_DATABASE_URL:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Select structural baseline
        id: structural-baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo 'restore_head_migrations=false' >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" = 'pull_request' ]] \
            && [[ -n "${PR_BASE_SHA:-}" ]] \
            && ! git diff --quiet "$PR_BASE_SHA" "$PR_HEAD_SHA" -- supabase/migrations; then
            echo "Schema-changing PR detected; structural drift will be checked against PR base $PR_BASE_SHA."
            git checkout "$PR_BASE_SHA" -- supabase/migrations
            echo 'restore_head_migrations=true' >> "$GITHUB_OUTPUT"
            echo "AUDIT_SCHEMA_BASELINE=pr-base:$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "AUDIT_SCHEMA_BASELINE=head:${PR_HEAD_SHA:-$GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Start migrated local database
        shell: bash
        run: supabase start

      - name: Rebuild structural baseline from repository migrations
        shell: bash
        run: supabase db reset

      - name: Restore PR-head migrations for tree audit
        if: steps.structural-baseline.outputs.restore_head_migrations == 'true'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout "$PR_HEAD_SHA" -- supabase/migrations

      - name: Run consolidated audit
        shell: bash
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/preprod-consolidated-audit.sh

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprod-consolidated-audit
          path: artifacts/preprod-audit
          if-no-files-found: error
          retention-days: 30

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
