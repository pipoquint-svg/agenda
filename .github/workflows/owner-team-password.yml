name: Owner Team Password

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin-team-member-access/**'
      - 'supabase/functions/_shared/team-password.ts'
      - 'supabase/functions/_shared/team-password_test.ts'
      - 'supabase/functions/_shared/supabase.ts'
      - 'supabase/functions/_shared/admin-auth.ts'
      - 'tests/local-verification/owner_team_password_e2e_test.ts'
      - '.github/workflows/owner-team-password.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-team-password:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit rules and type-check
        run: |
          deno test supabase/functions/_shared/team-password_test.ts
          deno check supabase/functions/admin-team-member-access/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Mirror production Auth redirect and e-mail confirmation in the ephemeral local stack
        run: |
          cat >> supabase/config.toml <<'EOF'

          [auth]
          site_url = "https://www.blacksheepestudiocriativo.com.br"
          additional_redirect_urls = ["https://www.blacksheepestudiocriativo.com.br/gestao/recuperar-senha"]

          [auth.email]
          enable_confirmations = true
          EOF

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,realtime,storage-api

      - name: Owner password end-to-end against local Auth
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          supabase functions serve \
            --env-file supabase/functions/.env.local-verification.example \
            > /tmp/owner-password-functions.log 2>&1 &
          serve_pid=$!
          trap 'kill "$serve_pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request OPTIONS \
              "$API_URL/functions/v1/admin-team-member-access" || true)"
            if [[ "$status" == "200" || "$status" == "204" ]]; then ready=true; break; fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then cat /tmp/owner-password-functions.log >&2; exit 1; fi

          # The recovery e-mail and link checks need the local mail catcher.
          mail_url="${MAILPIT_URL:-${INBUCKET_URL:-}}"
          test -n "$mail_url"
          LOCAL_API_URL="$API_URL" LOCAL_ANON_KEY="$ANON_KEY" LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          LOCAL_MAIL_URL="$mail_url" \
          deno test \
            --allow-env=LOCAL_API_URL,LOCAL_ANON_KEY,LOCAL_SERVICE_ROLE_KEY,LOCAL_MAIL_URL \
            --allow-net=127.0.0.1:54321,127.0.0.1:54324 \
            tests/local-verification/owner_team_password_e2e_test.ts

          # Neither the function nor Auth may log a password, token or recovery link.
          if grep -Eq 'Local-[0-9a-f]{8}-Aa1|access_token|token=' /tmp/owner-password-functions.log; then
            echo 'Sensitive value found in Edge Function logs' >&2
            exit 1
          fi
          if docker logs "$(docker ps --format '{{.Names}}' | grep '^supabase_auth_' | head -1)" 2>&1 | grep -Eq 'Local-[0-9a-f]{8}-Aa1'; then
            echo 'Password found in Auth logs' >&2
            exit 1
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
