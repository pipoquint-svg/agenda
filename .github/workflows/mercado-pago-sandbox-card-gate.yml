name: Mercado Pago Sandbox Card Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite SANDBOX para confirmar uso exclusivo de credenciais e cartões de teste"
        required: true
        type: string

permissions:
  contents: read

jobs:
  card-gate:
    name: Cartão teste Orders API
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 25
    env:
      APP_ENV: staging
      MERCADO_PAGO_ENV: sandbox
      ALLOW_REAL_CHARGES: "false"
      ALLOW_REAL_CUSTOMER_DATA: "false"
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
      MERCADO_PAGO_PUBLIC_KEY: ${{ secrets.MERCADO_PAGO_PUBLIC_KEY }}

    steps:
      - name: Require explicit sandbox confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "SANDBOX" ]] || { echo "Confirmação inválida." >&2; exit 1; }
          [[ "$APP_ENV" == "staging" && "$MERCADO_PAGO_ENV" == "sandbox" ]]
          [[ "$ALLOW_REAL_CHARGES" == "false" && "$ALLOW_REAL_CUSTOMER_DATA" == "false" ]]

      - name: Require test credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${MERCADO_PAGO_ACCESS_TOKEN:-}" ]] || { echo "Secret MERCADO_PAGO_ACCESS_TOKEN ausente." >&2; exit 1; }
          [[ -n "${MERCADO_PAGO_PUBLIC_KEY:-}" ]] || { echo "Secret MERCADO_PAGO_PUBLIC_KEY ausente." >&2; exit 1; }
          echo "Credenciais de sandbox presentes; valores não serão exibidos."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install isolated browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mp-card-run
          cp scripts/mp-card-tokenize.mjs /tmp/mp-card-run/mp-card-tokenize.mjs
          cd /tmp/mp-card-run
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Approved card — tokenize and create Order
        id: approved
        shell: bash
        env:
          CARDHOLDER_NAME: APRO-AUTH
          OUTPUT_PATH: /tmp/mp-approved-token.json
        run: |
          set -euo pipefail
          cd /tmp/mp-card-run
          node mp-card-tokenize.mjs

          token="$(jq -r '.token' "$OUTPUT_PATH")"
          method="$(jq -r '.paymentMethodId' "$OUTPUT_PATH")"
          installments="$(jq -r '.installments' "$OUTPUT_PATH")"
          [[ -n "$token" && "$token" != "null" && -n "$method" && "$method" != "null" ]]

          external_ref="sandbox-card-approved-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          idem="sandbox-card-approved-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body_file="$(mktemp)"
          response_file="$(mktemp)"

          jq -n \
            --arg external "$external_ref" \
            --arg token "$token" \
            --arg method "$method" \
            --argjson installments "$installments" \
            '{
              type:"online",
              processing_mode:"automatic",
              capture_mode:"automatic",
              external_reference:$external,
              total_amount:"50.00",
              config:{online:{transaction_security:{validation:"on_fraud_risk",liability_shift:"required"}}},
              payer:{email:"test@testuser.com"},
              transactions:{payments:[{amount:"50.00",payment_method:{id:$method,type:"credit_card",token:$token,installments:$installments}}]}
            }' > "$body_file"

          http="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST 'https://api.mercadopago.com/v1/orders' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --header "X-Idempotency-Key: $idem" \
            --data-binary "@$body_file")"

          rm -f "$body_file" "$OUTPUT_PATH"
          if [[ "$http" != "200" && "$http" != "201" ]]; then
            echo "Order aprovada não criada: HTTP $http" >&2
            jq '{status,status_detail,errors}' "$response_file" >&2 || true
            exit 1
          fi

          order_id="$(jq -r '.id // empty' "$response_file")"
          status="$(jq -r '.status // .transactions.payments[0].status // empty' "$response_file")"
          detail="$(jq -r '.status_detail // .transactions.payments[0].status_detail // empty' "$response_file")"
          [[ -n "$order_id" ]]
          [[ "$status" == "processed" ]]
          [[ "$detail" == "accredited" ]]

          get_file="$(mktemp)"
          get_http="$(curl --silent --show-error --output "$get_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            "https://api.mercadopago.com/v1/orders/${order_id}")"
          [[ "$get_http" == "200" ]]
          [[ "$(jq -r '.id' "$get_file")" == "$order_id" ]]
          [[ "$(jq -r '.status // .transactions.payments[0].status' "$get_file")" == "processed" ]]

          echo "order_id=$order_id" >> "$GITHUB_OUTPUT"
          rm -f "$response_file" "$get_file"
          echo "Approved card PASS; token never logged."

      - name: Rejected card — tokenize and create Order
        id: rejected
        shell: bash
        env:
          CARDHOLDER_NAME: OTHE-NAUT
          OUTPUT_PATH: /tmp/mp-rejected-token.json
        run: |
          set -euo pipefail
          cd /tmp/mp-card-run
          node mp-card-tokenize.mjs

          token="$(jq -r '.token' "$OUTPUT_PATH")"
          method="$(jq -r '.paymentMethodId' "$OUTPUT_PATH")"
          installments="$(jq -r '.installments' "$OUTPUT_PATH")"
          [[ -n "$token" && "$token" != "null" && -n "$method" && "$method" != "null" ]]

          external_ref="sandbox-card-rejected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          idem="sandbox-card-rejected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body_file="$(mktemp)"
          response_file="$(mktemp)"

          jq -n \
            --arg external "$external_ref" \
            --arg token "$token" \
            --arg method "$method" \
            --argjson installments "$installments" \
            '{
              type:"online",
              processing_mode:"automatic",
              capture_mode:"automatic",
              external_reference:$external,
              total_amount:"50.00",
              config:{online:{transaction_security:{validation:"on_fraud_risk",liability_shift:"required"}}},
              payer:{email:"test@testuser.com"},
              transactions:{payments:[{amount:"50.00",payment_method:{id:$method,type:"credit_card",token:$token,installments:$installments}}]}
            }' > "$body_file"

          http="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST 'https://api.mercadopago.com/v1/orders' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --header "X-Idempotency-Key: $idem" \
            --data-binary "@$body_file")"

          rm -f "$body_file" "$OUTPUT_PATH"
          if [[ "$http" != "200" && "$http" != "201" ]]; then
            echo "Order de recusa não criada: HTTP $http" >&2
            jq '{status,status_detail,errors}' "$response_file" >&2 || true
            exit 1
          fi

          order_id="$(jq -r '.id // empty' "$response_file")"
          status="$(jq -r '.status // .transactions.payments[0].status // empty' "$response_file")"
          detail="$(jq -r '.status_detail // .transactions.payments[0].status_detail // empty' "$response_file")"
          [[ -n "$order_id" ]]
          [[ "$status" == "failed" ]]
          [[ "$detail" == "failed" ]]

          get_file="$(mktemp)"
          get_http="$(curl --silent --show-error --output "$get_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            "https://api.mercadopago.com/v1/orders/${order_id}")"
          [[ "$get_http" == "200" ]]
          [[ "$(jq -r '.id' "$get_file")" == "$order_id" ]]
          [[ "$(jq -r '.status // .transactions.payments[0].status' "$get_file")" == "failed" ]]

          echo "order_id=$order_id" >> "$GITHUB_OUTPUT"
          rm -f "$response_file" "$get_file"
          echo "Rejected card PASS; token never logged."

      - name: Record sandbox card evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Mercado Pago Sandbox Card Gate'
            echo
            echo '- Environment: `sandbox`'
            echo '- Real charges allowed: `false`'
            echo '- Real customer data allowed: `false`'
            echo '- Browser tokenization with test Public Key: `PASS`'
            echo '- Approved card (`APRO-AUTH`) via Orders API: `PASS`'
            echo '- Rejected card (`OTHE-NAUT`) via Orders API: `PASS`'
            echo '- Approved Order ID: `${{ steps.approved.outputs.order_id }}`'
            echo '- Rejected Order ID: `${{ steps.rejected.outputs.order_id }}`'
            echo '- Card token / raw card data persisted or printed: `NO`'
            echo
            echo 'Este gate não valida ainda challenge 3DS nem liquidação de uma reserva interna da Agenda.'
          } >> "$GITHUB_STEP_SUMMARY"
