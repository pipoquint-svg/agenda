name: Mercado Pago Sandbox Card Provider Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite SANDBOX para confirmar uso exclusivo de credenciais e cartões de teste"
        required: true
        type: string

permissions:
  contents: read

jobs:
  card-provider-gate:
    name: Cartão provider sandbox Orders API
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 12
    env:
      APP_ENV: staging
      MERCADO_PAGO_ENV: sandbox
      ALLOW_REAL_CHARGES: "false"
      ALLOW_REAL_CUSTOMER_DATA: "false"
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}

    steps:
      - name: Require explicit sandbox confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "SANDBOX" ]] || { echo "Confirmação inválida." >&2; exit 1; }
          [[ "$APP_ENV" == "staging" && "$MERCADO_PAGO_ENV" == "sandbox" ]]
          [[ "$ALLOW_REAL_CHARGES" == "false" && "$ALLOW_REAL_CUSTOMER_DATA" == "false" ]]
          [[ -n "${MERCADO_PAGO_ACCESS_TOKEN:-}" ]] || { echo "Secret MERCADO_PAGO_ACCESS_TOKEN ausente." >&2; exit 1; }

      - name: Approved card APRO — create token and Order
        id: approved
        shell: bash
        run: |
          set -euo pipefail
          token_body="$(mktemp)"
          token_response="$(mktemp)"
          order_body="$(mktemp)"
          order_response="$(mktemp)"
          trap 'rm -f "$token_body" "$token_response" "$order_body" "$order_response"' EXIT

          jq -n '{
            card_number:"5480832801033311",
            expiration_month:11,
            expiration_year:2030,
            security_code:"123",
            cardholder:{name:"APRO",identification:{type:"CPF",number:"12345678909"}}
          }' > "$token_body"

          token_http="$(curl --silent --show-error --output "$token_response" --write-out '%{http_code}' \
            --request POST 'https://api.mercadopago.com/v1/card_tokens' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$token_body")"
          [[ "$token_http" == "200" || "$token_http" == "201" ]] || {
            echo "Token APRO falhou: HTTP $token_http" >&2
            jq '{message,error,cause}' "$token_response" >&2 || true
            exit 1
          }
          token="$(jq -r '.id // empty' "$token_response")"
          [[ -n "$token" ]]

          external_ref="sandbox-card-approved-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg external "$external_ref" --arg token "$token" '{
            type:"online",
            processing_mode:"automatic",
            capture_mode:"automatic",
            external_reference:$external,
            total_amount:"50.00",
            payer:{email:"test@testuser.com",identification:{type:"CPF",number:"12345678909"}},
            transactions:{payments:[{amount:"50.00",payment_method:{id:"master",type:"credit_card",token:$token,installments:1}}]}
          }' > "$order_body"

          order_http="$(curl --silent --show-error --output "$order_response" --write-out '%{http_code}' \
            --request POST 'https://api.mercadopago.com/v1/orders' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --header "X-Idempotency-Key: $external_ref" \
            --data-binary "@$order_body")"
          [[ "$order_http" == "200" || "$order_http" == "201" ]] || {
            echo "Order APRO falhou: HTTP $order_http" >&2
            jq '{status,status_detail,errors}' "$order_response" >&2 || true
            exit 1
          }

          order_id="$(jq -r '.id // empty' "$order_response")"
          status="$(jq -r '.status // .transactions.payments[0].status // empty' "$order_response")"
          detail="$(jq -r '.status_detail // .transactions.payments[0].status_detail // empty' "$order_response")"
          [[ -n "$order_id" ]]
          [[ "$status" == "processed" ]]
          [[ "$detail" == "accredited" ]]

          echo "order_id=$order_id" >> "$GITHUB_OUTPUT"
          echo "APRO PASS: processed/accredited; token e cartão não foram impressos."

      - name: Rejected card OTHE — create token and require provider rejection
        shell: bash
        run: |
          set -euo pipefail
          token_body="$(mktemp)"
          token_response="$(mktemp)"
          order_body="$(mktemp)"
          order_response="$(mktemp)"
          trap 'rm -f "$token_body" "$token_response" "$order_body" "$order_response"' EXIT

          jq -n '{
            card_number:"5480832801033311",
            expiration_month:11,
            expiration_year:2030,
            security_code:"123",
            cardholder:{name:"OTHE",identification:{type:"CPF",number:"12345678909"}}
          }' > "$token_body"

          token_http="$(curl --silent --show-error --output "$token_response" --write-out '%{http_code}' \
            --request POST 'https://api.mercadopago.com/v1/card_tokens' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$token_body")"
          [[ "$token_http" == "200" || "$token_http" == "201" ]] || {
            echo "Token OTHE falhou antes da prova de recusa: HTTP $token_http" >&2
            jq '{message,error,cause}' "$token_response" >&2 || true
            exit 1
          }
          token="$(jq -r '.id // empty' "$token_response")"
          [[ -n "$token" ]]

          external_ref="sandbox-card-rejected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg external "$external_ref" --arg token "$token" '{
            type:"online",
            processing_mode:"automatic",
            capture_mode:"automatic",
            external_reference:$external,
            total_amount:"50.00",
            payer:{email:"test@testuser.com",identification:{type:"CPF",number:"12345678909"}},
            transactions:{payments:[{amount:"50.00",payment_method:{id:"master",type:"credit_card",token:$token,installments:1}}]}
          }' > "$order_body"

          order_http="$(curl --silent --show-error --output "$order_response" --write-out '%{http_code}' \
            --request POST 'https://api.mercadopago.com/v1/orders' \
            --header "Authorization: Bearer $MERCADO_PAGO_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --header "X-Idempotency-Key: $external_ref" \
            --data-binary "@$order_body")"

          [[ "$order_http" == "402" ]] || {
            echo "OTHE deveria ser recusado com HTTP 402; recebido HTTP $order_http" >&2
            jq '{id,status,status_detail,errors}' "$order_response" >&2 || true
            exit 1
          }
          jq -e '.errors[]? | select(.code == "failed")' "$order_response" >/dev/null || {
            echo "OTHE foi recusado, mas sem o erro esperado 'failed'." >&2
            jq '{errors}' "$order_response" >&2 || true
            exit 1
          }
          echo "OTHE PASS: recusa esperada HTTP 402 / failed."

      - name: Record provider-level card evidence
        shell: bash
        run: |
          {
            echo '## Mercado Pago Sandbox Card Provider Gate'
            echo
            echo '- Environment: `sandbox`'
            echo '- Provider card token endpoint: `PASS`'
            echo '- Approved card (`APRO`) Orders API: `processed/accredited` — `PASS`'
            echo '- Rejected card (`OTHE`) Orders API: `HTTP 402 / failed` — `PASS`'
            echo '- Approved Order ID: `${{ steps.approved.outputs.order_id }}`'
            echo '- Raw card/token printed: `NO`'
            echo '- Real charges/customer data: `NO`'
            echo
            echo '> Scope: PROVIDER_SANDBOX. This does not approve browser tokenization, 3DS or full client journey.'
          } >> "$GITHUB_STEP_SUMMARY"
