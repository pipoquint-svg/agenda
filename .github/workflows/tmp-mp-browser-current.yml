name: TMP Mercado Pago Browser Current
on:
  push:
    branches: [test/mercado-pago-current-main]
    paths: [.github/workflows/tmp-mp-browser-current.yml]
permissions:
  contents: write
env:
  STAGING_URL: https://blacksheep-agenda-staging.lovable.app/agenda-e-valores
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/mp-browser
          cd /tmp/mp-browser
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Extrair JavaScript oficial do browser gate
        run: |
          set -euo pipefail
          awk '
            /cat > \/tmp\/mp-browser\/gate\.mjs <<'\''EOF'\''/ {capture=1; next}
            capture && /^          EOF$/ {capture=0; exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/mercado-pago-staging-browser-gate.yml > /tmp/mp-browser/gate.mjs
          test -s /tmp/mp-browser/gate.mjs
          grep -Fq "await scenario('APRO')" /tmp/mp-browser/gate.mjs
          grep -Fq "await scenario('OTHE')" /tmp/mp-browser/gate.mjs
      - name: Executar APRO e OTHE no staging HTTPS
        run: |
          mkdir -p evidence
          set +e
          cd /tmp/mp-browser
          xvfb-run -a node gate.mjs > "$GITHUB_WORKSPACE/evidence/mp-browser-run.log" 2>&1
          code=$?
          cat "$GITHUB_WORKSPACE/evidence/mp-browser-run.log"
          exit $code
      - name: Persist evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p evidence
          printf '{"gate":"browser_https_current","status":"%s","sha":"%s","staging":"%s","real_charges":false,"real_customer_data":false}\n' "$JOB_STATUS" "$GITHUB_SHA" "$STAGING_URL" > evidence/mp-browser-current.json
          cp /tmp/mp-browser/*.png evidence/ 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add evidence
          git commit -m 'test: registrar browser gate Mercado Pago atual' || true
          git push
