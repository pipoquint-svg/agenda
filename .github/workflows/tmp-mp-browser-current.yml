name: TMP Mercado Pago Browser Current
on:
  push:
    branches: [test/mercado-pago-current-main]
    paths: [.github/workflows/tmp-mp-browser-current.yml]
permissions:
  contents: write
env:
  STAGING_URL: https://blacksheep-agenda-staging.lovable.app/agenda-e-valores
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright e PyYAML
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          mkdir -p /tmp/mp-browser
          cd /tmp/mp-browser
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Extrair harness oficial da main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          p='.github/workflows/mercado-pago-staging-browser-gate.yml'
          data=yaml.safe_load(open(p))
          steps=data['jobs']['browser-card-gate']['steps']
          run=next(s['run'] for s in steps if s.get('name')=='Run HTTPS browser scenarios')
          open('/tmp/run-browser.sh','w').write(run)
          PY
          chmod +x /tmp/run-browser.sh
      - name: Executar APRO e OTHE no staging HTTPS
        run: /tmp/run-browser.sh
      - name: Persist evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p evidence
          printf '{"gate":"browser_https_current","status":"%s","sha":"%s","staging":"%s","real_charges":false,"real_customer_data":false}\n' "$JOB_STATUS" "$GITHUB_SHA" "$STAGING_URL" > evidence/mp-browser-current.json
          cp /tmp/mp-browser/*.png evidence/ 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add evidence
          git commit -m 'test: registrar browser gate Mercado Pago atual' || true
          git push
