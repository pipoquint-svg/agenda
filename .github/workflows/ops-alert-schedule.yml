name: Ops Alert Schedule

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-alert-schedule
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request pinned GitHub OIDC token and run monitor
        shell: bash
        env:
          OIDC_AUDIENCE: blacksheep-agenda-ops-alert-monitor
          MONITOR_URL: https://sbexdggbwqvyhbkatucs.supabase.co/functions/v1/ops-alert-monitor
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          separator='&'
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" != *'?'* ]]; then
            separator='?'
          fi

          token_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_response")"
          test -n "$token"

          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$MONITOR_URL")"

          cat "$body"
          echo
          if [[ "$status" != '200' ]]; then
            echo "ops-alert-monitor failed with HTTP $status" >&2
            exit 1
          fi
          grep -q '"ok":true' "$body"
