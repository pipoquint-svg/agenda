name: Web Core

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-core.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-core.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check web
        run: npm run check

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-key
          VITE_MERCADO_PAGO_PUBLIC_KEY: TEST-public-key
        run: npm run build

      - name: Verify Natal wrapper compatibility for cutover bundle
        run: node scripts/cutover-natal-wrapper-compat.mjs

      - name: Preserve cutover embed bundle
        uses: actions/upload-artifact@v4
        with:
          name: cutover-agenda-embed-${{ github.sha }}
          path: web/dist/embed
          if-no-files-found: error
          retention-days: 7

      - name: Install Chromium for admin smoke
        run: npx playwright install --with-deps chromium

      - name: Run admin browser smoke
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/agenda-vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/admin >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/agenda-vite-preview.log; exit 1; fi
            sleep 1
          done
          npm run smoke:admin-browser
