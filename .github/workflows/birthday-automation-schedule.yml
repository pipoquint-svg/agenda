name: Birthday Automation Schedule

on:
  schedule:
    - cron: '10 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: birthday-automation-schedule
  cancel-in-progress: false

jobs:
  run-birthday-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token and invoke isolated birthday runtime
        shell: bash
        env:
          OIDC_AUDIENCE: blacksheep-agenda-birthday-scheduler
          BIRTHDAY_URL: https://jlyvlvmspfjwbcmhmhwz.supabase.co/functions/v1/birthday-automation-trigger
          BIRTHDAY_EMAIL_URL: https://jlyvlvmspfjwbcmhmhwz.supabase.co/functions/v1/birthday-email-worker
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          separator='&'
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" != *'?'* ]]; then
            separator='?'
          fi

          token_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_response")"
          test -n "$token"

          invoke() {
            local name="$1"
            local url="$2"
            local body
            body="$(mktemp)"
            local status
            status="$(curl --silent --show-error \
              --output "$body" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${token}" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$url")"
            cat "$body"
            echo
            if [[ "$status" != '200' ]]; then
              echo "$name failed with HTTP $status" >&2
              exit 1
            fi
            grep -q '"ok":true' "$body"
          }

          invoke birthday-automation-trigger "$BIRTHDAY_URL"
          invoke birthday-email-worker "$BIRTHDAY_EMAIL_URL"
