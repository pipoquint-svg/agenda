name: Ops Production Access Probe

on:
  push:
    branches:
      - ops/rc-8128699-prod-bundle
    paths:
      - '.github/workflows/ops-prod-access-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: sbexdggbwqvyhbkatucs
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require repository-scoped credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'REPOSITORY_SUPABASE_ACCESS_TOKEN_UNAVAILABLE' >&2; exit 42; }

      - name: Read-only production probe
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"query":"select 1 as ok","read_only":true}')"
          printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*1'
          echo 'PRODUCTION_READ_ONLY_PROBE_OK'
