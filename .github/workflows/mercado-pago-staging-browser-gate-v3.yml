name: Mercado Pago Staging Browser Gate V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mercado-pago-staging-browser-gate-v3.yml
      - scripts/mercado-pago-staging-browser-gate.mjs

permissions:
  contents: read
  issues: write

env:
  STAGING_URL: https://blacksheep-agenda-staging.lovable.app/agenda-e-valores
  ARTIFACT_DIR: /tmp/mp-browser-v3

jobs:
  browser-card-gate-v3:
    name: Browser HTTPS audited — APRO e OTHE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p "$ARTIFACT_DIR"

      - name: Run current HTTPS journey
        id: browser
        shell: bash
        run: xvfb-run -a node scripts/mercado-pago-staging-browser-gate.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercado-pago-staging-browser-v3
          path: /tmp/mp-browser-v3/*.png
          if-no-files-found: ignore

      - name: Record evidence in gate issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 73 --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ## Mercado Pago — browser HTTPS staging V3

          - run_id: \`${RUN_ID}\`
          - result: **${RESULT}**
          - SHA: \`${HEAD_SHA}\`
          - URL do run: ${RUN_URL}
          - jornada: Tempo → Data/Horário → Pessoas → Extras → Dados → Revisão → Pagamento
          - cenários: APRO + OTHE
          - ambiente: sandbox, dados sintéticos
          - cartão/cliente/cobrança real: **NÃO**
          - backend/provider alterado para este gate: **NÃO**

          Evidência registrada automaticamente para o gate \`STAGING_BROWSER\`.
          EOF
          )"
