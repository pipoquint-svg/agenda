name: Email Internal Secret Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-internal-secret-bootstrap.yml'

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Supabase access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Generate and store internal secret
        shell: bash
        run: |
          set -euo pipefail
          internal_secret="$(openssl rand -hex 32)"
          supabase secrets set "INTEGRATION_INTERNAL_SECRET=${internal_secret}" --project-ref "$SUPABASE_PROJECT_REF"
          echo "INTEGRATION_INTERNAL_SECRET stored in Supabase; value intentionally not printed."

      - name: Verify secret name exists
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -q 'INTEGRATION_INTERNAL_SECRET'
          echo "INTEGRATION_INTERNAL_SECRET present."

      - name: Run authoritative email E2E gate
        id: e2e
        shell: bash
        run: |
          set -euo pipefail
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/email-e2e-gate"
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$url")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          compact="$(tr -d '\n\r' < "$body" | head -c 4000)"
          printf 'body=%s\n' "$compact" >> "$GITHUB_OUTPUT"
          if [[ "$status" != "200" ]]; then
            echo "E2E gate failed with HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi
          grep -q '"ok":true' "$body"

      - name: Record evidence in issue 134
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.e2e.outputs.status }}'
          body='${{ steps.e2e.outputs.body }}'
          {
            echo '## Email E2E autoritativo — bootstrap do secret interno'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- `INTEGRATION_INTERNAL_SECRET`: gerado aleatoriamente e armazenado no Supabase sem exposição do valor.'
            echo '- `TRANSACTIONAL_EMAIL_WORKER_ENABLED`: permaneceu `false`.'
            echo '- `ALLOW_REAL_EMAIL_RECIPIENTS`: permaneceu `false`.'
            echo "- HTTP do \`email-e2e-gate\`: \`${status:-sem-status}\`"
            echo '- Retorno seguro:'
            echo '```json'
            printf '%s\n' "${body:-sem-retorno}"
            echo '```'
          } > /tmp/evidence.md
          gh issue comment 134 --repo pipoquint-svg/agenda --body-file /tmp/evidence.md
