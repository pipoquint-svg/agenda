name: Mercado Pago Sandbox Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref da Agenda a publicar no sandbox"
        required: true
        default: "feature/mercado-pago-orders-api"
        type: string
      confirmation:
        description: "Digite SANDBOX para confirmar que nenhum dado ou charge real deve ser usado"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Mercado Pago no sandbox
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 20
    env:
      APP_ENV: staging
      MERCADO_PAGO_ENV: sandbox
      ALLOW_REAL_CUSTOMER_DATA: "false"
      ALLOW_REAL_CHARGES: "false"
      SUPABASE_PROJECT_REF: jlyvlvmspfjwbcmhmhwz
      MERCADO_PAGO_WEBHOOK_URL: https://jlyvlvmspfjwbcmhmhwz.supabase.co/functions/v1/mercado-pago-webhook
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SANDBOX_DATABASE_URL: ${{ secrets.SANDBOX_DATABASE_URL }}
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
      MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}

    steps:
      - name: Require explicit sandbox confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "SANDBOX" ]]; then
            echo "Confirmação inválida. Digite SANDBOX." >&2
            exit 1
          fi

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Require sandbox secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SANDBOX_DATABASE_URL MERCADO_PAGO_ACCESS_TOKEN MERCADO_PAGO_WEBHOOK_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name ausente no environment sandbox" >&2
              exit 1
            fi
          done

      - name: Validate Mercado Pago Orders API access read-only
        shell: bash
        run: |
          set -euo pipefail
          begin_date="$(date -u -d '1 day ago' +'%Y-%m-%dT%H:%M:%S.000Z')"
          end_date="$(date -u +'%Y-%m-%dT%H:%M:%S.999Z')"

          status="$(curl --silent --show-error \
            --output /tmp/mp-orders-scope.json \
            --write-out '%{http_code}' \
            --get \
            --header 'accept: application/json' \
            --header "Authorization: Bearer ${MERCADO_PAGO_ACCESS_TOKEN}" \
            --data-urlencode "begin_date=${begin_date}" \
            --data-urlencode "end_date=${end_date}" \
            --data-urlencode 'external_reference=blacksheep-sandbox-scope-preflight' \
            --data-urlencode 'page=1' \
            --data-urlencode 'page_size=1' \
            'https://api.mercadopago.com/v1/orders')"

          python3 - "$status" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          try:
              data = json.load(open('/tmp/mp-orders-scope.json'))
          except Exception:
              data = {}
          if status == 200:
              print('Mercado Pago Orders API: acesso de leitura confirmado; nenhuma Order ou cobrança criada.')
              raise SystemExit(0)
          message = data.get('message') or data.get('error') or data.get('code') or 'sem mensagem'
          print(f'Mercado Pago Orders API preflight falhou: HTTP {status}: {message}')
          raise SystemExit(1)
          PY

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dry-run database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SANDBOX_DATABASE_URL" --include-all --dry-run

      - name: Apply database migrations to sandbox
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SANDBOX_DATABASE_URL" --include-all

      - name: Configure Mercado Pago Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            MERCADO_PAGO_ACCESS_TOKEN="$MERCADO_PAGO_ACCESS_TOKEN" \
            MERCADO_PAGO_SANDBOX_ACCESS_TOKEN="$MERCADO_PAGO_ACCESS_TOKEN" \
            MERCADO_PAGO_WEBHOOK_URL="$MERCADO_PAGO_WEBHOOK_URL" \
            MERCADO_PAGO_WEBHOOK_SECRET="$MERCADO_PAGO_WEBHOOK_SECRET" \
            MERCADO_PAGO_ENV="$MERCADO_PAGO_ENV" \
            APP_ENV="$APP_ENV" \
            ALLOW_REAL_CHARGES="$ALLOW_REAL_CHARGES" \
            ALLOW_REAL_CUSTOMER_DATA="$ALLOW_REAL_CUSTOMER_DATA"

      - name: Deploy Mercado Pago payment function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy mercado-pago-payment \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api

      - name: Deploy Mercado Pago webhook function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy mercado-pago-webhook \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api

      - name: Smoke test Order webhook authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"type":"order","live_mode":false,"data":{"id":"sandbox-smoke"}}' \
            "$MERCADO_PAGO_WEBHOOK_URL")"
          cat "$body_file"
          echo
          if [[ "$status" != "401" ]]; then
            echo "Webhook respondeu HTTP $status; esperado 401 sem assinatura." >&2
            exit 1
          fi
          if ! grep -q 'MERCADO_PAGO_SIGNATURE_REQUIRED' "$body_file"; then
            echo "Webhook não retornou o código de assinatura obrigatória esperado." >&2
            exit 1
          fi

      - name: Record sandbox deployment evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercado Pago Sandbox Deploy — Orders API"
            echo
            echo "- Project ref: \`$SUPABASE_PROJECT_REF\`"
            echo "- Source ref: \`${{ inputs.ref }}\`"
            echo "- APP_ENV: \`$APP_ENV\`"
            echo "- MERCADO_PAGO_ENV: \`$MERCADO_PAGO_ENV\`"
            echo "- Scoped credential: \`MERCADO_PAGO_SANDBOX_ACCESS_TOKEN\`"
            echo "- ALLOW_REAL_CHARGES: \`$ALLOW_REAL_CHARGES\`"
            echo "- Webhook URL: \`$MERCADO_PAGO_WEBHOOK_URL\`"
            echo "- Webhook signing secret: CONFIGURADO"
            echo "- Provider API: \`Orders API\`"
            echo
            echo "Este workflow publica/configura o sandbox somente após preflight read-only de Orders."
            echo "PIX/cartão/3DS/webhook assinado permanecem NÃO TESTADOS até a matriz real de sandbox ser executada."
          } >> "$GITHUB_STEP_SUMMARY"
