name: Sandbox Integration Gate

on:
  workflow_dispatch:

jobs:
  preflight-and-gate-a:
    name: Preflight + Gate A remoto
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 15
    env:
      APP_ENV: staging
      GOOGLE_TEST_PROJECT_ID: ${{ vars.GOOGLE_TEST_PROJECT_ID }}
      GOOGLE_TEST_ACCOUNT_EMAIL: ${{ vars.GOOGLE_TEST_ACCOUNT_EMAIL }}
      GOOGLE_TEST_CALENDAR_PREFIX: ${{ vars.GOOGLE_TEST_CALENDAR_PREFIX }}
      GOOGLE_AUTH_STRATEGY: ${{ vars.GOOGLE_AUTH_STRATEGY }}
      GOOGLE_GRANTED_SCOPES: ${{ vars.GOOGLE_GRANTED_SCOPES }}
      MERCADO_PAGO_ENV: sandbox
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
      MERCADO_PAGO_TEST_USER_ID: ${{ vars.MERCADO_PAGO_TEST_USER_ID }}
      ALLOW_REAL_CUSTOMER_DATA: "false"
      ALLOW_REAL_CHARGES: "false"
      DATABASE_URL: ${{ secrets.SANDBOX_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate sandbox isolation
        run: bash scripts/verify-integration-test-env.sh

      - name: Require sandbox database
        run: |
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "SANDBOX_DATABASE_URL ausente" >&2
            exit 1
          fi

      - name: Gate A — remote exclusion race
        run: bash scripts/test-concurrency.sh

      - name: Record current evidence scope
        if: always()
        run: |
          {
            echo "## Sandbox Integration Gate"
            echo
            echo "Este workflow cobre apenas o pre-flight e a corrida base de exclusão do Gate A."
            echo
            echo "- Etapa 1 / corrida base de recurso: consultar resultado acima"
            echo "- Etapa 1 / holds simultâneos: NÃO TESTADO por este workflow"
            echo "- Etapa 1 / hold x confirmação: NÃO TESTADO por este workflow"
            echo "- Etapa 1 / external block durante hold: NÃO TESTADO por este workflow"
            echo "- Etapa 2 / iPhone Safari: NÃO TESTADO"
            echo "- Etapa 3 / pagamento após expiração: NÃO TESTADO"
            echo "- Etapa 4 / Google real em calendários TESTE: NÃO TESTADO"
            echo "- Etapa 5 / Kommo provider: NÃO TESTADO neste workflow; gate próprio #112"
            echo "- Etapa 6 / jornada em dispositivos reais: NÃO TESTADO"
            echo "- WhatsApp direto/Meta: FORA DO ESCOPO da Agenda V1.12"
            echo
            echo "Nenhum item NÃO TESTADO pode ser considerado aprovado."
          } >> "$GITHUB_STEP_SUMMARY"
