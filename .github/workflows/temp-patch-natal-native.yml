name: Temp Patch Natal Native Flow

on:
  push:
    branches:
      - fix/natal-staged-flow-native
    paths:
      - '.github/workflows/temp-patch-natal-native.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natal-staged-flow-native
          fetch-depth: 0
      - name: Apply native Natal patch
        run: python scripts/temp_patch_natal_native.py
      - name: Validate diff
        run: git diff --check
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/SabrinaBookingJourney.tsx web/src/embed.tsx
          git commit -m 'fix(natal): restore staged booking journey natively'
          git push origin HEAD:fix/natal-staged-flow-native
