name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character main SHA to deploy
        required: true
        type: string
      deploy_database:
        description: Apply pending versioned database migrations
        required: true
        default: true
        type: boolean
      deploy_edge_functions:
        description: Deploy Edge Functions from the same SHA
        required: true
        default: true
        type: boolean
      edge_function_subset:
        description: Optional comma-separated allowlisted Edge slugs; blank deploys the full allowlist
        required: false
        default: ''
        type: string
      reconcile_migration_history:
        description: One-time fail-closed production migration-history baseline before Item 4
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: agenda-production-deploy
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact main SHA and an explicit deploy scope
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          DEPLOY_DATABASE: ${{ inputs.deploy_database }}
          DEPLOY_EDGE_FUNCTIONS: ${{ inputs.deploy_edge_functions }}
          EDGE_FUNCTION_SUBSET: ${{ inputs.edge_function_subset }}
          RECONCILE_MIGRATION_HISTORY: ${{ inputs.reconcile_migration_history }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = 'refs/heads/main'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$EVENT_SHA"
          if [[ "$DEPLOY_DATABASE" != 'true' && "$DEPLOY_EDGE_FUNCTIONS" != 'true' ]]; then
            echo 'At least one deploy scope must be selected.' >&2
            exit 1
          fi
          if [[ "$RECONCILE_MIGRATION_HISTORY" == 'true' && "$DEPLOY_DATABASE" != 'true' ]]; then
            echo 'Migration-history reconciliation requires deploy_database=true.' >&2
            exit 1
          fi
          if [[ -n "$EDGE_FUNCTION_SUBSET" && "$DEPLOY_EDGE_FUNCTIONS" != 'true' ]]; then
            echo 'edge_function_subset requires deploy_edge_functions=true.' >&2
            exit 1
          fi
          if [[ -n "$EDGE_FUNCTION_SUBSET" && ! "$EDGE_FUNCTION_SUBSET" =~ ^[a-z0-9,-]+$ ]]; then
            echo 'edge_function_subset contains an invalid character.' >&2
            exit 1
          fi

  rebuild:
    needs: validate-release
    uses: ./.github/workflows/db-core.yml

  deploy:
    needs: [validate-release, rebuild]
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: sbexdggbwqvyhbkatucs
      DEPLOY_DATABASE: ${{ inputs.deploy_database }}
      DEPLOY_EDGE_FUNCTIONS: ${{ inputs.deploy_edge_functions }}
      EDGE_FUNCTION_SUBSET: ${{ inputs.edge_function_subset }}
      RECONCILE_MIGRATION_HISTORY: ${{ inputs.reconcile_migration_history }}
    steps:
      - name: Checkout exact gated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify checkout and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          if [[ "$DEPLOY_DATABASE" == 'true' ]]; then
            test -n "$SUPABASE_DB_PASSWORD"
          fi

      - name: Link production database
        if: ${{ inputs.deploy_database }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Reconcile legacy production migration history
        if: ${{ inputs.deploy_database && inputs.reconcile_migration_history }}
        run: python3 scripts/production_migration_history_baseline.py apply --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify only Item 4 is pending after migration-history reconciliation
        if: ${{ inputs.deploy_database && inputs.reconcile_migration_history }}
        run: python3 scripts/production_migration_history_baseline.py verify-ready --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending database migrations
        if: ${{ inputs.deploy_database }}
        run: supabase db push --linked --dry-run

      - name: Apply pending versioned database migrations
        if: ${{ inputs.deploy_database }}
        run: supabase db push --linked --yes

      - name: Validate Edge Function auth and deploy allowlist
        if: ${{ inputs.deploy_edge_functions }}
        run: python3 scripts/edge-auth-contract.py after

      - name: Deploy allowlisted Edge Functions from gated SHA
        if: ${{ inputs.deploy_edge_functions }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t allowlisted < <(python3 scripts/edge-auth-contract.py list-deployable)
          test "${#allowlisted[@]}" -gt 0

          if [[ -n "$EDGE_FUNCTION_SUBSET" ]]; then
            IFS=',' read -r -a requested <<< "$EDGE_FUNCTION_SUBSET"
            functions=()
            for slug in "${requested[@]}"; do
              if ! printf '%s\n' "${allowlisted[@]}" | grep -Fxq "$slug"; then
                echo "Edge Function is not deployable by contract: $slug" >&2
                exit 1
              fi
              if [[ " ${functions[*]-} " != *" $slug "* ]]; then
                functions+=("$slug")
              fi
            done
          else
            functions=("${allowlisted[@]}")
          fi
          test "${#functions[@]}" -gt 0
          for slug in "${functions[@]}"; do
            echo "Deploying ${slug}"
            supabase functions deploy "$slug" --project-ref "$SUPABASE_PROJECT_REF"
          done
