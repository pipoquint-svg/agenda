name: Staging HTTPS

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/staging-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agenda-staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: web
        run: npm run check

      - name: Build staging bundle
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://jlyvlvmspfjwbcmhmhwz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_NqPTd8ErT6PUeqlwwgaDpQ_TNvu7hHh
          VITE_MERCADO_PAGO_PUBLIC_KEY: APP_USR-1e45b5f7-95b1-4a44-b102-8cac95d3d6e8
        run: npm run build -- --base=/agenda/

      - name: Enforce staging noindex and SPA fallback
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dist/index.html')
          text = path.read_text()
          marker = '<meta name="robots" content="noindex,nofollow,noarchive">'
          if marker not in text:
              text = text.replace('<head>', '<head>' + marker, 1)
          path.write_text(text)
          Path('dist/404.html').write_text(text)
          PY
          printf '%s\n' "$GITHUB_SHA" > dist/release-sha.txt

      - name: Preserve SHA-linked staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: staging-bundle-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Smoke published SHA and browser routes
        working-directory: web
        env:
          STAGING_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/staging-https-smoke.mjs
