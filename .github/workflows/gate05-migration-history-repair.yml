name: Gate 05 Migration History Repair

on:
  workflow_dispatch:

jobs:
  repair-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Inspect remote history without database password
        run: supabase migration list --linked --project-ref sbexdggbwqvyhbkatucs
      - name: Align recorded migration versions
        run: |
          supabase migration repair --linked --project-ref sbexdggbwqvyhbkatucs --status reverted 20260913143607 20260913143753 20260913143801 --yes
          supabase migration repair --linked --project-ref sbexdggbwqvyhbkatucs --status applied 20260912130000 20260912160000 20260913110000 --yes
      - name: Verify remote history and preview no replay
        run: |
          supabase migration list --linked --project-ref sbexdggbwqvyhbkatucs
          supabase db push --linked --project-ref sbexdggbwqvyhbkatucs --dry-run
