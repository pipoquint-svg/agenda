name: Gate 05 Migration History Repair

on:
  workflow_dispatch:
  push:
    branches:
      - codex/agenda-pr05-tenant-foundation
    paths:
      - .github/workflows/gate05-migration-history-repair.yml

jobs:
  repair-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Link the current project without database password
        run: supabase link --project-ref sbexdggbwqvyhbkatucs
      - name: Preflight remote history without mutation
        run: |
          supabase migration list --linked | tee migration-history.txt
          grep -q '20260913143607' migration-history.txt
          grep -q '20260913143753' migration-history.txt
          grep -q '20260913143801' migration-history.txt
          ! grep -q '20260912130000' migration-history.txt
          ! grep -q '20260912160000' migration-history.txt
          ! grep -q '20260913110000' migration-history.txt
