name: Gate 05 Migration History Repair

on:
  workflow_dispatch:
  push:
    branches:
      - codex/agenda-pr05-tenant-foundation
    paths:
      - .github/workflows/gate05-migration-history-repair.yml

jobs:
  repair-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Link the current project without database password
        run: supabase link --project-ref sbexdggbwqvyhbkatucs
      - name: Record verified preflight history
        run: |
          supabase migration list --linked | tee migration-history.txt
      - name: Repair verified recorded versions
        run: |
          supabase migration repair --linked --status reverted 20260913143607 20260913143753 20260913143801 --yes
          supabase migration repair --linked --status applied 20260912130000 20260912160000 20260913110000 --yes
      - name: Verify repaired history and dry-run
        run: |
          supabase migration list --linked
          supabase db push --linked --dry-run
