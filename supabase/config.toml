project_id = "blacksheep-agenda"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = false

# These functions implement their own authentication because Google callbacks/webhooks
# and internal worker calls do not carry a Supabase user JWT.
[functions.google-oauth]
verify_jwt = false

[functions.google-sync]
verify_jwt = false

[functions.google-webhook]
verify_jwt = false

[functions.google-watch]
verify_jwt = false

[functions.google-appointment-sync]
verify_jwt = false

# Internal Kommo mirror adapter. It requires x-internal-secret and reads the provider
# token only from the Edge secret environment.
[functions.kommo-sync]
verify_jwt = false

# Internal transactional-email adapter. It requires x-internal-secret and reads the
# provider API key only from the Edge secret environment.
[functions.email-send]
verify_jwt = false

# Historical email diagnostics are permanently retired. They stay publicly callable
# only to return a deterministic 410 tombstone and must never read secrets or send mail.
[functions.email-provider-probe]
verify_jwt = false

[functions.email-e2e-gate]
verify_jwt = false

[functions.email-live-status]
verify_jwt = false

[functions.integration-worker]
verify_jwt = false

# Internal rental-balance worker and its provider/email adapters authenticate with
# x-internal-secret. They are called server-to-server and do not carry a Supabase JWT.
[functions.balance-collection-worker]
verify_jwt = false

[functions.balance-collection-notify-email]
verify_jwt = false

[functions.balance-collection-provider-cancel]
verify_jwt = false

# Public HTTP boundary for the scheduled worker. Supabase JWT verification is disabled
# because this endpoint verifies a GitHub Actions OIDC token itself and pins the exact
# repository id, owner id, main ref and workflow_ref before calling integration-worker.
[functions.integration-worker-trigger]
verify_jwt = false

# Demand capture is public by design. Server-side validation is authoritative.
[functions.demand-capture]
verify_jwt = false

# Public hold creation is routed through a distributed rate limit before the
# service-role-only authoritative hold RPC.
[functions.booking-hold]
verify_jwt = false

# Public tokenized checkout operations are routed through a distributed rate limit.
[functions.booking-checkout]
verify_jwt = false

# Public checkout submit validates the opaque hold token server-side and captures
# request evidence (IP/User-Agent) before calling service-role-only promotion.
[functions.booking-submit]
verify_jwt = false

# Public payment uses the opaque appointment token and never trusts client amounts.
[functions.mercado-pago-payment]
verify_jwt = false

# Read-only payment-method preview. It validates the opaque appointment token itself,
# is rate-limited, and returns backend-calculated cash amounts only.
[functions.payment-preview]
verify_jwt = false

# Mercado Pago authenticates webhook requests with x-signature/x-request-id.
[functions.mercado-pago-webhook]
verify_jwt = false

# Historical sandbox slug is tombstoned and returns 410 only.
[functions.mercado-pago-card-staging]
verify_jwt = false

# Opaque pre-reservation tokens are resolved only behind distributed rate limiting.
[functions.prebook-access]
verify_jwt = false

# Action-specific opaque links resolve/verify through a custom distributed-rate-limited boundary.
[functions.appointment-action-access]
verify_jwt = false

# Admin endpoints validate the Supabase Auth bearer token against admin_users manually.
# JWT verification is intentionally performed inside the function so CORS preflight and
# error envelopes remain under the same application boundary.
[functions.demand-capture-admin]
verify_jwt = false

[functions.admin-agenda]
verify_jwt = false

[functions.admin-dashboard]
verify_jwt = false

[functions.admin-operation-settings]
verify_jwt = false

[functions.admin-service-settings]
verify_jwt = false

[functions.admin-appointment-actions]
verify_jwt = false

[functions.admin-reschedule-actions]
verify_jwt = false

[functions.admin-pre-reservations]
verify_jwt = false

[functions.admin-read-models]
verify_jwt = false

[functions.admin-appointment-timeline]
verify_jwt = false
